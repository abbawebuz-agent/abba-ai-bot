{% load static %}<!doctype html>
<html lang="{{ user_language|default:'uz' }}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"/>
<title>JIP — Santexnik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Inter',-apple-system,system-ui,sans-serif;background:#f2f3f5;color:#111;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:0;height:0;}
button,[role="button"]{-webkit-tap-highlight-color:transparent;cursor:pointer;border:none;background:none;font-family:inherit;}
input{font-family:inherit;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes slideIn{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
.anim-up{animation:fadeUp 380ms cubic-bezier(.22,1,.36,1) both}
.press{transition:transform 120ms ease,opacity 120ms ease}
.press:active{transform:scale(0.97);opacity:0.85}
.scroll-x{overflow-x:auto;scrollbar-width:none}
.scroll-y{overflow-y:auto;scrollbar-width:none}
</style>
</head>
<body data-lang="{{ user_language|default:'uz_latin' }}">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

{% verbatim %}
<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── Telegram ───────────────────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.enableClosingConfirmation?.(); }
const TG_ID = tg?.initDataUnsafe?.user?.id || null;
const TG_USER_RAW = tg?.initDataUnsafe?.user || {};
const LANG = document.body.dataset.lang || 'uz_latin';
const IS_RU = LANG === 'ru';
const haptic = (k='light') => tg?.HapticFeedback?.impactOccurred?.(k);
const hapticSuccess = () => tg?.HapticFeedback?.notificationOccurred?.('success');
const hapticError = () => tg?.HapticFeedback?.notificationOccurred?.('error');
const hapticSelect = () => tg?.HapticFeedback?.selectionChanged?.();

// ── i18n ──────────────────────────────────────────────────────
const i18n = {
  home: IS_RU?'Главная':'Bosh sahifa',
  gifts: IS_RU?'Подарки':"Sovg'alar",
  history: IS_RU?'История':'Tarix',
  orders: IS_RU?'Заявки':"So'rovlar",
  profile: IS_RU?'Профиль':'Profil',
  balance: IS_RU?'Баллы':'Balllar',
  pts: IS_RU?'балл':'ball',
  enter_promo: IS_RU?'Введите промокод':'Promokodni kiriting',
  activate: IS_RU?'Активировать':'Faollashtirish',
  all_gifts: IS_RU?'Смотреть все подарки':"Barcha sovg'alarni ko'rish",
  top_title: IS_RU?'Топ сантехников':'Top santexniklar',
  contact_admin: IS_RU?'Связаться с администратором':'Administrator bilan bog\'lanish',
  order_gift: IS_RU?'Заказать подарок':"Sovg'ani buyurtma qilish",
  exchange: IS_RU?'Обменять':'Almashtirish',
  need_pts: IS_RU?'Нужно ещё':'Yana kerak',
  your_balance: IS_RU?'Ваш баланс':'Sizning balansingiz',
  after_order: IS_RU?'После заказа':'Buyurtmadan keyin',
  confirm_order: IS_RU?'Подтвердить заказ':'Buyurtmani tasdiqlash',
  cancel: IS_RU?'Отмена':'Bekor qilish',
  close: IS_RU?'Закрыть':'Yopish',
  status_pending: IS_RU?'Ожидает рассмотрения':'Ko\'rib chiqilmoqda',
  status_approved: IS_RU?'Подтверждено, готовится':'Tasdiqlandi, tayyorlanmoqda',
  status_sent: IS_RU?'Отправлено':'Yuborildi',
  status_completed: IS_RU?'Получено':'Qabul qilindi',
  status_rejected: IS_RU?'Отклонено':'Rad etildi',
  status_cancelled: IS_RU?'Отменено':'Bekor qilingan',
  status_not_received: IS_RU?'Не получено':'Qabul qilinmadi',
  confirm_receipt: IS_RU?'Подтвердить получение':'Qabul qildim',
  promo_empty: IS_RU?'История пуста':'Tarix bo\'sh',
  promo_empty_sub: IS_RU?'Введите первый промокод':'Birinchi promokodingizni kiriting',
  orders_empty: IS_RU?'Заявок пока нет':'Hali so\'rovlar yo\'q',
  orders_empty_sub: IS_RU?'Обменяйте баллы на подарок':"Ballarni sovg'aga almashtiring",
  gifts_empty: IS_RU?'Подарков пока нет':"Hali sovg'alar yo\'q",
  cancel_order: IS_RU?'Отменить заявку':'Arizani bekor qilish',
  phone: IS_RU?'Телефон':'Telefon',
  region: IS_RU?'Регион':'Viloyat',
  username: IS_RU?'Username':'Username',
  member_since: IS_RU?'Участник с':'A\'zo bo\'lgan',
  total_scans: IS_RU?'Всего сканов':'Jami skan',
  total_pts: IS_RU?'Всего баллов заработано':'Jami yig\'ilgan ball',
  loading: IS_RU?'Загрузка...':'Yuklanmoqda...',
  error_load: IS_RU?'Ошибка загрузки':'Yuklashda xato',
  retry: IS_RU?'Повторить':'Qaytadan',
  loyalty: IS_RU?'Программа лояльности':'Sodiqlik dasturi',
  promo_activated: IS_RU?'Промокод активирован!':'Promokod faollashdi!',
  rank: IS_RU?'Место':'O\'rin',
  scans: IS_RU?'Сканов':'Skan',
  my_place: IS_RU?'Моё место':'Mening o\'rnim',
  not_in_top: IS_RU?'Пока нет в топе':'Hali topda yo\'q',
  tg_id: IS_RU?'Telegram ID':'Telegram ID',
};
const t = k => i18n[k] || k;

// ── Design tokens ─────────────────────────────────────────────
const C = {
  bg: '#f2f3f5',
  card: '#ffffff',
  border: '#e8e8ec',
  text: '#111111',
  sub: '#6b6b7a',
  faint: '#c8c8d0',
  brand: '#4f46e5',
  brandDeep: '#3730a3',
  brandSoft: '#eef2ff',
  brandTint: '#f5f3ff',
  brandLite: '#818cf8',
  good: '#10b981',
  goodSoft: '#d1fae5',
  warn: '#f59e0b',
  warnSoft: '#fef3c7',
  bad: '#ef4444',
  badSoft: '#fee2e2',
  tabH: 64,
  navH: 56,
};

// ── API ───────────────────────────────────────────────────────
const BASE = '/api';
const api = async (path, opts={}) => {
  const sep = path.includes('?')?'&':'?';
  const url = TG_ID && !opts.noId ? `${BASE}${path}${sep}telegram_id=${TG_ID}` : `${BASE}${path}`;
  const r = await fetch(url, {
    method: opts.method||'GET',
    headers: {'Content-Type':'application/json',...(opts.headers||{})},
    cache: 'no-store',
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await r.json().catch(()=>({}));
  if (!r.ok) throw data;
  return data;
};

// ── Helpers ───────────────────────────────────────────────────
const fmtPts = n => (n||0).toLocaleString('ru-RU');
const fmtDate = s => s ? new Date(s).toLocaleDateString(IS_RU?'ru-RU':'uz-UZ',{day:'2-digit',month:'2-digit',year:'numeric'}) : '';
const statusInfo = s => {
  const map = {
    pending:  {label:t('status_pending'),  color:C.warn,   bg:C.warnSoft,  step:0},
    approved: {label:t('status_approved'), color:C.brand,  bg:C.brandSoft, step:1},
    sent:     {label:t('status_sent'),     color:'#0ea5e9',bg:'#e0f2fe',   step:2},
    completed:{label:t('status_completed'),color:C.good,   bg:C.goodSoft,  step:3},
    rejected: {label:t('status_rejected'), color:C.bad,    bg:C.badSoft,   step:-1},
    cancelled_by_user:{label:t('status_cancelled'),color:C.sub,bg:'#f4f4f6',step:-1},
    not_received:{label:t('status_not_received'),color:C.bad,bg:C.badSoft,step:-1},
  };
  return map[s] || {label:s,color:C.sub,bg:'#f4f4f6',step:0};
};

// ── Icons ─────────────────────────────────────────────────────
const Icon = ({n,size=20,color='currentColor',sw=1.8,style:st}) => {
  const s = {fill:'none',stroke:color,strokeWidth:sw,strokeLinecap:'round',strokeLinejoin:'round'};
  const shapes = {
    home:   <><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-5h4v5h5V9.5"/></>,
    gift:   <><path d="M3 9h18v4H3z"/><path d="M5 13v8h14v-8"/><path d="M12 9v12"/><path d="M12 9c-2.7-.9-4.5-2-4.5-3.5A2.5 2.5 0 0 1 12 3a2.5 2.5 0 0 1 4.5 2.5C16.5 7 14.7 8 12 9"/></>,
    clock:  <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></>,
    list:   <><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1.2" fill={color} stroke="none"/><circle cx="4" cy="12" r="1.2" fill={color} stroke="none"/><circle cx="4" cy="18" r="1.2" fill={color} stroke="none"/></>,
    user:   <><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></>,
    coin:   <><circle cx="12" cy="12" r="9"/><path d="M9 8h4.5a2.5 2.5 0 0 1 0 5H9m0 0h5a2.5 2.5 0 0 1 0 5H9V5v14"/></>,
    qr:     <><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 18v3"/></>,
    chevR:  <path d="m9 6 6 6-6 6"/>,
    chevL:  <path d="m15 6-6 6 6 6"/>,
    check:  <path d="m5 12 5 5L20 7"/>,
    x:      <><path d="M6 6l12 12"/><path d="M18 6 6 18"/></>,
    phone:  <path d="M5 4h3l2 5-2 1.5a11 11 0 0 0 5.5 5.5L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>,
    send:   <><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9l20-7z"/></>,
    trophy: <><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0V4Z"/><path d="M17 5h2.5a1.5 1.5 0 0 1 0 5h-2"/><path d="M7 5H4.5a1.5 1.5 0 0 0 0 5h2"/></>,
    star:   <path d="m12 2 3 7h7l-6 4 2 7-6-4-6 4 2-7-6-4h7z"/>,
    info:   <><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="8" r=".5" fill={color} sw={0}/></>,
    img:    <><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></>,
    tg:     <><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9l20-7z"/></>,
    globe:  <><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></>,
    spin:   <path d="M21 12a9 9 0 1 1-3-6.7"/>,
    bag:    <><path d="M6 2 3 6v14h18V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></>,
  };
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" style={st}>
      <g {...s}>{shapes[n]||null}</g>
    </svg>
  );
};

// ── Spinner ───────────────────────────────────────────────────
const Spin = ({size=20,color=C.brand}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" style={{animation:'spin 0.8s linear infinite',flexShrink:0}}>
    <circle cx="12" cy="12" r="9" fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeDasharray="48" strokeDashoffset="16"/>
  </svg>
);

// ── Pill badge ────────────────────────────────────────────────
const Badge = ({label,color,bg,style:st}) => (
  <span style={{display:'inline-flex',alignItems:'center',padding:'3px 10px',borderRadius:999,
    fontSize:11,fontWeight:700,color,background:bg,letterSpacing:0.1,...st}}>{label}</span>
);

// ── Avatar ────────────────────────────────────────────────────
const Avatar = ({name,size=40}) => {
  const letter = (name||'?').trim()[0].toUpperCase();
  let h=0; for(const c of name||'') h=(h*31+c.charCodeAt(0))%1000;
  const colors=['#4f46e5','#0ea5e9','#10b981','#f59e0b','#ec4899','#8b5cf6'];
  const bg = colors[h%colors.length];
  return (
    <div style={{width:size,height:size,borderRadius:999,background:bg,
      display:'flex',alignItems:'center',justifyContent:'center',
      color:'#fff',fontWeight:700,fontSize:size*0.42,flexShrink:0}}>
      {letter}
    </div>
  );
};

// ── Toast ─────────────────────────────────────────────────────
let _toastTimer;
const Toast = ({msg,type='success',onHide}) => {
  useEffect(()=>{
    _toastTimer = setTimeout(onHide,2800);
    return ()=>clearTimeout(_toastTimer);
  },[]);
  const bg = type==='success'?C.good : type==='error'?C.bad : C.warn;
  return (
    <div style={{position:'fixed',top:16,left:'50%',transform:'translateX(-50%)',
      zIndex:200,background:bg,color:'#fff',
      borderRadius:12,padding:'10px 18px',fontSize:14,fontWeight:600,
      boxShadow:'0 6px 24px rgba(0,0,0,0.18)',
      display:'flex',alignItems:'center',gap:8,maxWidth:'calc(100vw - 32px)',
      animation:'fadeUp 260ms cubic-bezier(.22,1,.36,1) both',whiteSpace:'pre-wrap'}}>
      <Icon n={type==='success'?'check':'info'} size={16} color="#fff"/>
      {msg}
    </div>
  );
};

// ── Bottom Sheet ──────────────────────────────────────────────
const Sheet = ({open,onClose,title,children,maxH='88vh'}) => (
  <div style={{position:'fixed',inset:0,zIndex:100,
    pointerEvents:open?'auto':'none',display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
    <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.4)',
      opacity:open?1:0,transition:'opacity 220ms ease'}}/>
    <div className="scroll-y" style={{position:'relative',background:'#fff',borderRadius:'20px 20px 0 0',
      maxHeight:maxH,overflow:'auto',
      transform:open?'translateY(0)':'translateY(110%)',
      transition:'transform 300ms cubic-bezier(.22,1,.36,1)',
      boxShadow:'0 -8px 32px rgba(0,0,0,0.15)',paddingBottom:32}}>
      <div style={{display:'flex',justifyContent:'center',padding:'10px 0 2px',flexShrink:0}}>
        <div style={{width:36,height:4,borderRadius:4,background:C.faint}}/>
      </div>
      {title && (
        <div style={{padding:'8px 20px 14px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div style={{fontSize:18,fontWeight:700,color:C.text}}>{title}</div>
          <button className="press" onClick={onClose} style={{padding:6,borderRadius:8,background:C.bg}}>
            <Icon n="x" size={18} color={C.sub}/>
          </button>
        </div>
      )}
      <div style={{padding:'0 20px'}}>{children}</div>
    </div>
  </div>
);

// ── Promo input ───────────────────────────────────────────────
const PromoInput = ({onSuccess}) => {
  const [val,setVal] = useState('');
  const [loading,setLoading] = useState(false);
  const [err,setErr] = useState('');

  const submit = async () => {
    const code = val.trim().toUpperCase();
    if (!code) return;
    haptic();
    setLoading(true); setErr('');
    try {
      const res = await api('/webapp/register-qr/',{method:'POST',body:{telegram_id:TG_ID,qr_code:code}});
      hapticSuccess();
      setVal('');
      onSuccess && onSuccess(res);
    } catch(e) {
      hapticError();
      setErr(e.error || t('error_load'));
    } finally { setLoading(false); }
  };

  return (
    <div style={{marginBottom:4}}>
      <div style={{display:'flex',gap:8}}>
        <input
          value={val}
          onChange={e=>{setVal(e.target.value);setErr('');}}
          onKeyDown={e=>e.key==='Enter'&&submit()}
          placeholder={t('enter_promo')}
          style={{flex:1,height:48,borderRadius:12,border:`1.5px solid ${err?C.bad:C.border}`,
            background:C.card,padding:'0 14px',fontSize:15,color:C.text,outline:'none',
            transition:'border-color 180ms'}}
        />
        <button
          onClick={submit}
          disabled={loading||!val.trim()}
          className="press"
          style={{height:48,minWidth:48,borderRadius:12,background:val.trim()?C.brand:'#e8e8ec',
            color:val.trim()?'#fff':C.faint,display:'flex',alignItems:'center',justifyContent:'center',
            padding:'0 16px',gap:6,fontSize:14,fontWeight:600,transition:'background 180ms'}}>
          {loading ? <Spin size={18} color="#fff"/> : <><Icon n="send" size={16} color={val.trim()?'#fff':C.faint}/> {t('activate')}</>}
        </button>
      </div>
      {err && <div style={{marginTop:6,fontSize:12,color:C.bad,fontWeight:500}}>{err}</div>}
    </div>
  );
};

// ── Banner slider ─────────────────────────────────────────────
const Banner = () => {
  const [items,setItems] = useState([]);
  const [idx,setIdx] = useState(0);
  const ref = useRef();

  useEffect(()=>{
    api('/webapp/promotions/',{noId:true}).then(d=>setItems(Array.isArray(d)?d:[])).catch(()=>{});
  },[]);

  useEffect(()=>{
    if(items.length<=1) return;
    const id = setInterval(()=>setIdx(i=>(i+1)%items.length),3500);
    return ()=>clearInterval(id);
  },[items.length]);

  if(!items.length) return null;

  return (
    <div style={{borderRadius:16,overflow:'hidden',position:'relative',aspectRatio:'2.4/1',background:C.brandTint}}>
      {items.map((it,i)=>(
        <div key={it.id} style={{position:'absolute',inset:0,opacity:i===idx?1:0,
          transition:'opacity 500ms ease',pointerEvents:i===idx?'auto':'none'}}>
          {it.image
            ? <img src={it.image} alt={it.title} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
            : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center',
                background:`linear-gradient(135deg,${C.brand},${C.brandLite})`,color:'#fff',fontSize:15,fontWeight:600,padding:20,textAlign:'center'}}>{it.title}</div>
          }
        </div>
      ))}
      {items.length>1 && (
        <div style={{position:'absolute',bottom:8,left:'50%',transform:'translateX(-50%)',
          display:'flex',gap:4,pointerEvents:'none'}}>
          {items.map((_,i)=>(
            <div key={i} style={{width:i===idx?16:5,height:5,borderRadius:999,
              background:i===idx?'#fff':'rgba(255,255,255,0.5)',transition:'width 300ms ease'}}/>
          ))}
        </div>
      )}
    </div>
  );
};

// ══════════════════════════════════════════════════════════════
// PAGE: HOME
// ══════════════════════════════════════════════════════════════
const PageHome = ({user,onRefreshUser,onTab,showToast}) => {
  const [redemptions,setRedemptions] = useState([]);
  const [topUsers,setTopUsers] = useState([]);
  const [contact,setContact] = useState(null);
  const [promoResult,setPromoResult] = useState(null);

  useEffect(()=>{
    if(!TG_ID) return;
    api('/webapp/redemptions/').then(d=>setRedemptions(Array.isArray(d)?d:[])).catch(()=>{});
    api('/webapp/top-users/?period=all&limit=5').then(d=>setTopUsers(d.items||[])).catch(()=>{});
    api('/webapp/admin-contact/',{noId:true}).then(setContact).catch(()=>{});
  },[]);

  const activeOrder = useMemo(()=>
    redemptions.find(r=>!['completed','rejected','cancelled_by_user','not_received'].includes(r.status))
  ,[redemptions]);

  const handlePromoSuccess = (res) => {
    showToast(res.message || t('promo_activated'),'success');
    onRefreshUser();
  };

  const si = activeOrder ? statusInfo(activeOrder.status) : null;

  return (
    <div className="scroll-y" style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:16}}>

      {/* Hero card */}
      <div className="anim-up" style={{background:`linear-gradient(135deg, ${C.brandDeep} 0%, ${C.brand} 60%, ${C.brandLite} 100%)`,
        borderRadius:20,padding:'20px 20px 18px',color:'#fff',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-20,right:-20,width:100,height:100,borderRadius:999,
          background:'rgba(255,255,255,0.06)'}}/>
        <div style={{position:'absolute',bottom:-30,right:20,width:80,height:80,borderRadius:999,
          background:'rgba(255,255,255,0.05)'}}/>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:16,position:'relative'}}>
          <Avatar name={user.first_name||'U'} size={44}/>
          <div>
            <div style={{fontSize:11,fontWeight:600,opacity:0.7,letterSpacing:'0.08em',textTransform:'uppercase',marginBottom:2}}>{t('loyalty')}</div>
            <div style={{fontSize:16,fontWeight:700}}>{user.first_name||'—'}</div>
          </div>
          <div style={{marginLeft:'auto',background:'rgba(255,255,255,0.12)',borderRadius:10,padding:'4px 10px',
            fontSize:11,color:'rgba(255,255,255,0.8)',fontWeight:600}}>
            ID {user.telegram_id}
          </div>

const PageGifts = ({user,onRefreshUser,showToast}) => {
  const [gifts,setGifts] = useState([]);
  const [loading,setLoading] = useState(true);
  const [selected,setSelected] = useState(null);
  const [ordering,setOrdering] = useState(false);

  useEffect(()=>{
    setLoading(true);
    api('/webapp/gifts/').then(d=>{setGifts(Array.isArray(d)?d:[]);setLoading(false);})
      .catch(()=>setLoading(false));
  },[]);

  const orderGift = async (gift) => {
    if(user.points < gift.points_cost) return;
    haptic();
    setOrdering(true);
    try {
      await api('/webapp/request-gift/',{method:'POST',body:{telegram_id:TG_ID,gift_id:gift.id}});
      hapticSuccess();
      showToast(IS_RU?`Заявка на «${gift.name}» отправлена!`:`«${gift.name}» uchun ariza yuborildi!`,'success');
      setSelected(null);
      onRefreshUser();
    } catch(e) {
      hapticError();
      showToast(e.error||t('error_load'),'error');
    } finally { setOrdering(false); }
  };

  const canAfford = g => user.points >= g.points_cost;
  const affordable = gifts.filter(canAfford).sort((a,b)=>a.points_cost-b.points_cost);
  const upcoming = gifts.filter(g=>!canAfford(g)).sort((a,b)=>a.points_cost-b.points_cost);
  const all = [...affordable,...upcoming];

  return (
    <div className="scroll-y" style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:12}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'4px 0 8px'}}>
        <div style={{fontSize:22,fontWeight:800,letterSpacing:'-0.02em',color:C.text}}>{t('gifts')}</div>
        {user.points>0 && (
          <div style={{fontSize:13,fontWeight:600,color:C.brand,background:C.brandSoft,
            padding:'5px 12px',borderRadius:999}}>
            {fmtPts(user.points)} {t('pts')}
          </div>
        )}
      </div>

      {loading && (
        <div style={{display:'flex',justifyContent:'center',padding:40}}><Spin/></div>
      )}

      {!loading && all.length===0 && (
        <div style={{textAlign:'center',padding:'60px 20px'}}>
          <Icon n="gift" size={48} color={C.faint}/>
          <div style={{fontSize:15,fontWeight:600,color:C.sub,marginTop:12}}>{t('gifts_empty')}</div>
        </div>
      )}

      {!loading && all.length>0 && (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          {all.map(g=>{
            const ok = canAfford(g);
            return (
              <div key={g.id} className="press anim-up"
                onClick={()=>{hapticSelect();setSelected(g);}}
                style={{background:C.card,borderRadius:16,overflow:'hidden',cursor:'pointer',
                  border:`1.5px solid ${ok?C.brand+'33':C.border}`,
                  boxShadow:ok?`0 2px 12px ${C.brand}18`:'none'}}>
                <div style={{height:120,background:C.brandTint,position:'relative',overflow:'hidden'}}>
                  {g.image
                    ? <img src={g.image} alt={g.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>
                    : <div style={{width:'100%',height:'100%',display:'flex',alignItems:'center',justifyContent:'center'}}>
                        <Icon n="gift" size={36} color={C.brandLite}/>
                      </div>
                  }
                  {ok && (
                    <div style={{position:'absolute',top:8,right:8,
                      background:C.good,borderRadius:999,width:20,height:20,
                      display:'flex',alignItems:'center',justifyContent:'center'}}>
                      <Icon n="check" size={12} color="#fff" sw={2.5}/>
                    </div>
                  )}
                </div>
                <div style={{padding:'10px 10px 12px'}}>
                  <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:6,
                    overflow:'hidden',display:'-webkit-box',WebkitLineClamp:2,WebkitBoxOrient:'vertical'}}>
                    {g.name}
                  </div>
                  <div style={{fontSize:13,fontWeight:800,color:ok?C.brand:C.sub}}>
                    {fmtPts(g.points_cost)} {t('pts')}
                  </div>
                  {!ok && (
                    <div style={{fontSize:11,color:C.bad,marginTop:2,fontWeight:500}}>
                      +{fmtPts(g.points_cost-user.points)} {t('need_pts')}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{height:8}}/>

      {/* Gift detail sheet */}
      <Sheet open={!!selected} onClose={()=>setSelected(null)} title={selected?.name}>
        {selected && (
          <div>
            {selected.image && (
              <img src={selected.image} alt={selected.name}
                style={{width:'100%',height:200,objectFit:'cover',borderRadius:14,marginBottom:16}}/>
            )}
            {selected.description && (
              <p style={{fontSize:14,color:C.sub,lineHeight:1.6,marginBottom:16}}>{selected.description}</p>
            )}
            <div style={{background:C.bg,borderRadius:14,padding:'14px 16px',marginBottom:16}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                <span style={{fontSize:13,color:C.sub,fontWeight:500}}>{t('your_balance')}</span>
                <span style={{fontSize:14,fontWeight:700,color:C.text}}>{fmtPts(user.points)} {t('pts')}</span>
              </div>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
                <span style={{fontSize:13,color:C.sub,fontWeight:500}}>{t('order_gift')}</span>
                <span style={{fontSize:14,fontWeight:700,color:C.brand}}>−{fmtPts(selected.points_cost)} {t('pts')}</span>
              </div>
              <div style={{height:1,background:C.border,margin:'8px 0'}}/>
              <div style={{display:'flex',justifyContent:'space-between'}}>
                <span style={{fontSize:13,color:C.sub,fontWeight:500}}>{t('after_order')}</span>
                <span style={{fontSize:15,fontWeight:800,
                  color:canAfford(selected)?C.good:C.bad}}>
                  {fmtPts(user.points - selected.points_cost)} {t('pts')}
                </span>
              </div>
            </div>

            {canAfford(selected) ? (
              <button className="press" onClick={()=>orderGift(selected)} disabled={ordering}
                style={{width:'100%',height:52,borderRadius:14,background:C.brand,
                  color:'#fff',fontSize:16,fontWeight:700,display:'flex',alignItems:'center',
                  justifyContent:'center',gap:8}}>
                {ordering ? <Spin size={20} color="#fff"/> : <><Icon n="check" size={18} color="#fff"/>{t('exchange')}</>}
              </button>
            ) : (
              <div style={{textAlign:'center',padding:'14px 0 4px',fontSize:14,
                color:C.bad,fontWeight:600}}>
                {IS_RU
                  ?`Не хватает ${fmtPts(selected.points_cost-user.points)} баллов`
                  :`${fmtPts(selected.points_cost-user.points)} ball yetmaydi`}
              </div>
            )}
          </div>
        )}
      </Sheet>
    </div>
  );
};

const STEPS = ['pending','approved','sent','completed'];

const OrderCard = ({order,onConfirm,onCancel}) => {
  const si = statusInfo(order.status);
  const step = si.step;
  const isFinal = ['completed','rejected','cancelled_by_user','not_received'].includes(order.status);
  const isFailed = ['rejected','cancelled_by_user','not_received'].includes(order.status);
  const canConfirm = order.status==='sent';
  const canCancel = order.status==='pending';

  return (
    <div style={{background:C.card,borderRadius:16,border:`1.5px solid ${isFailed?C.bad+'33':si.color+'33'}`,
      overflow:'hidden',marginBottom:12}}>
      {/* Header */}
      <div style={{padding:'14px 16px 10px',display:'flex',alignItems:'center',gap:12}}>
        {order.gift?.image
          ? <img src={order.gift.image} alt="" style={{width:52,height:52,borderRadius:10,objectFit:'cover'}}/>
          : <div style={{width:52,height:52,borderRadius:10,background:C.brandTint,
              display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
              <Icon n="gift" size={22} color={C.brand}/>
            </div>
        }
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:15,fontWeight:700,color:C.text,overflow:'hidden',
            textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:3}}>
            {order.gift?.name}
          </div>
          <Badge label={si.label} color={si.color} bg={si.bg}/>
        </div>
      </div>

      {/* Progress steps — only for active orders */}
      {!isFailed && (
        <div style={{padding:'0 16px 12px',display:'flex',alignItems:'center',gap:0}}>
          {STEPS.map((s,i)=>{
            const done = step>i;
            const active = step===i;
            const labels = IS_RU
              ?['Принято','Готовится','Отправлено','Получено']
              :['Qabul','Tayyorlanmoqda','Yuborildi','Qabul qilindi'];
            return (
              <React.Fragment key={s}>
                <div style={{display:'flex',flexDirection:'column',alignItems:'center',flex:'none',width:56}}>
                  <div style={{width:24,height:24,borderRadius:999,
                    background:done||active?C.brand:C.border,
                    display:'flex',alignItems:'center',justifyContent:'center',
                    transition:'background 300ms'}}>
                    {done
                      ? <Icon n="check" size={12} color="#fff" sw={2.5}/>
                      : <div style={{width:8,height:8,borderRadius:999,
                          background:active?'#fff':C.faint}}/>
                    }
                  </div>
                  <div style={{fontSize:9,fontWeight:600,marginTop:3,textAlign:'center',
                    color:done||active?C.brand:C.faint,lineHeight:1.2}}>{labels[i]}</div>
                </div>
                {i<STEPS.length-1 && (
                  <div style={{flex:1,height:2,background:done?C.brand:C.border,
                    marginBottom:14,transition:'background 300ms'}}/>
                )}
              </React.Fragment>
            );
          })}
        </div>
      )}

      {/* Date */}
      <div style={{padding:'0 16px 12px',fontSize:12,color:C.sub}}>
        {IS_RU?'Заявка от ':'Ariza: '}{fmtDate(order.requested_at)}
      </div>

      {/* Admin notes */}
      {order.admin_notes && (
        <div style={{margin:'0 16px 12px',background:'#f8f8fa',borderRadius:10,
          padding:'10px 12px',fontSize:13,color:C.sub}}>
          <span style={{fontWeight:600,color:C.text}}>{IS_RU?'Примечание: ':'Izoh: '}</span>
          {order.admin_notes}
        </div>
      )}

      {/* Actions */}
      {(canConfirm || canCancel) && (
        <div style={{padding:'0 16px 14px',display:'flex',gap:8}}>
          {canConfirm && (
            <button className="press" onClick={()=>onConfirm(order)}
              style={{flex:1,height:44,borderRadius:12,background:C.good,
                color:'#fff',fontSize:14,fontWeight:700,display:'flex',
                alignItems:'center',justifyContent:'center',gap:6}}>
              <Icon n="check" size={16} color="#fff"/>
              {t('confirm_receipt')}
            </button>
          )}
          {canCancel && (
            <button className="press" onClick={()=>onCancel(order)}
              style={{flex:canConfirm?0:1,height:44,borderRadius:12,
                background:C.badSoft,border:`1px solid ${C.bad}33`,
                color:C.bad,fontSize:14,fontWeight:700,padding:'0 16px',
                display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
              <Icon n="x" size={14} color={C.bad}/>
              {t('cancel_order')}
            </button>
          )}
        </div>
      )}
    </div>
  );
};

  const [loading,setLoading] = useState(true);
  const [filter,setFilter] = useState('active');

      .catch(()=>setLoading(false));
  },[]);

  useEffect(()=>{ load(); },[]);

  const confirm = async (order) => {

    try {
      await api('/webapp/confirm-delivery/',{method:'POST',body:{redemption_id:order.id,confirmed:true}});

      showToast(IS_RU?'Получение подтверждено!':'Qabul tasdiqlandi!','success');
      load(); onRefreshUser();

      hapticError();
      showToast(e.error||t('error_load'),'error');

    try {

      showToast(IS_RU?'Заявка отменена':'Ariza bekor qilindi','success');
      load(); onRefreshUser();
    } catch(e) {
      hapticError();
      showToast(e.error||t('error_load'),'error');
    }
  };

  const active = orders.filter(o=>!['completed','rejected','cancelled_by_user','not_received'].includes(o.status));
  const done = orders.filter(o=>['completed','rejected','cancelled_by_user','not_received'].includes(o.status));
  const shown = filter==='active' ? active : done;

  return (
    <div className="scroll-y" style={{flex:1,overflowY:'auto',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'12px 16px 8px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <div style={{fontSize:22,fontWeight:800,letterSpacing:'-0.02em',color:C.text,padding:'4px 0'}}>{t('orders')}</div>
        {orders.length>0 && (
          <div style={{display:'flex',gap:4}}>
            {['active','done'].map(f=>(
              <button key={f} className="press" onClick={()=>{hapticSelect();setFilter(f);}}
                style={{padding:'6px 12px',borderRadius:10,fontSize:12,fontWeight:700,
                  background:filter===f?C.brand:C.bg,color:filter===f?'#fff':C.sub,
                  border:filter===f?'none':`1px solid ${C.border}`}}>
                {f==='active'?(IS_RU?'Активные':'Faol'):(IS_RU?'История':'Tarix')}
                {f==='active'&&active.length>0&&(
                  <span style={{marginLeft:4,background:filter==='active'?'rgba(255,255,255,0.2)':'#e8e8ec',
                    color:filter==='active'?'#fff':C.sub,borderRadius:999,padding:'0 5px',fontSize:11}}>
                    {active.length}
                  </span>
                )}
              </button>
            ))}
          </div>
        )}
      </div>

      <div style={{flex:1,padding:'4px 16px 12px'}}>
        {loading && <div style={{display:'flex',justifyContent:'center',padding:40}}><Spin/></div>}

        {!loading && shown.length===0 && (
          <div style={{textAlign:'center',padding:'60px 20px'}}>
            <Icon n="list" size={48} color={C.faint}/>
            <div style={{fontSize:15,fontWeight:600,color:C.sub,marginTop:12}}>{t('orders_empty')}</div>
            <div style={{fontSize:13,color:C.faint,marginTop:4}}>{t('orders_empty_sub')}</div>
          </div>
        )}

        {!loading && shown.map(o=>(
          <OrderCard key={o.id} order={o} onConfirm={confirm} onCancel={cancel}/>
        ))}
      </div>
    </div>
  );
};

// ══════════════════════════════════════════════════════════════
// PAGE: PROFILE
// ══════════════════════════════════════════════════════════════
const PageProfile = ({user,onLangChange}) => {
  const [history,setHistory] = useState([]);
  const [redemptions,setRedemptions] = useState([]);

  useEffect(()=>{
    api('/webapp/qr-history/').then(d=>setHistory(Array.isArray(d)?d:[])).catch(()=>{});
    api('/webapp/redemptions/').then(d=>setRedemptions(Array.isArray(d)?d:[])).catch(()=>{});
  },[]);

  const totalEarned = history.reduce((s,h)=>s+(h.points||0),0);
  const completedOrders = redemptions.filter(r=>r.status==='completed').length;

  const Row = ({label,value,icon,href}) => (
    <div style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',
      borderBottom:`1px solid ${C.border}`}}>
      <div style={{width:36,height:36,borderRadius:10,background:C.brandSoft,
        display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
        <Icon n={icon} size={16} color={C.brand}/>
      </div>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:11,color:C.sub,fontWeight:500,marginBottom:1}}>{label}</div>
        {href
          ? <a href={href} target="_blank" rel="noreferrer"
              style={{fontSize:14,fontWeight:600,color:C.brand,textDecoration:'none'}}>
              {value||'—'}
            </a>
          : <div style={{fontSize:14,fontWeight:600,color:C.text,overflow:'hidden',
              textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{value||'—'}</div>
        }
      </div>
    </div>
  );

  return (
    <div className="scroll-y" style={{flex:1,overflowY:'auto',padding:'12px 16px',display:'flex',flexDirection:'column',gap:16}}>
      {/* Header */}
      <div style={{display:'flex',alignItems:'center',gap:14,padding:'4px 0 4px'}}>
        <Avatar name={user.first_name||'U'} size={56}/>
        <div>
          <div style={{fontSize:20,fontWeight:800,color:C.text,letterSpacing:'-0.02em'}}>
            {user.first_name||'—'}
          </div>
          {user.username && (
            <div style={{fontSize:13,color:C.sub,marginTop:2}}>@{user.username}</div>
          )}
        </div>
      </div>

      {/* Stats */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
        {[
          {label:IS_RU?'Баллов':'Balllar', value:fmtPts(user.points), color:C.brand},
          {label:IS_RU?'Сканов':'Skanlar', value:history.length, color:C.good},
          {label:IS_RU?'Подарков':'Sovg\'alar', value:completedOrders, color:'#f59e0b'},
        ].map(s=>(
          <div key={s.label} style={{background:C.card,borderRadius:14,padding:'14px 10px',
            border:`1px solid ${C.border}`,textAlign:'center'}}>
            <div style={{fontSize:22,fontWeight:800,color:s.color,letterSpacing:'-0.02em'}}>{s.value}</div>
            <div style={{fontSize:11,color:C.sub,fontWeight:600,marginTop:3}}>{s.label}</div>
          </div>
        ))}
      </div>

      {/* Info */}
      <div style={{background:C.card,borderRadius:16,border:`1px solid ${C.border}`,overflow:'hidden'}}>
        <Row label={t('tg_id')} value={`#${user.telegram_id}`} icon="user"/>
        {user.phone_number && <Row label={t('phone')} value={user.phone_number} icon="phone"/>}
        {user.username && <Row label="Telegram" value={`@${user.username}`} icon="send"
          href={`https://t.me/${user.username}`}/>}
      </div>

      {/* Language */}
      <div style={{background:C.card,borderRadius:16,border:`1px solid ${C.border}`,padding:'14px 16px'}}>
        <div style={{fontSize:13,fontWeight:700,color:C.text,marginBottom:10,display:'flex',alignItems:'center',gap:6}}>
          <Icon n="globe" size={15} color={C.brand}/>
          {IS_RU?'Язык интерфейса':'Interfeys tili'}
        </div>
        <div style={{display:'flex',gap:8}}>
          {[['uz_latin',"🇺🇿 O'zbek"],['ru','🇷🇺 Русский']].map(([code,label])=>(
            <button key={code} className="press" onClick={()=>onLangChange(code)}
              style={{flex:1,height:44,borderRadius:12,fontSize:14,fontWeight:700,
                background:LANG===code?C.brand:C.bg,
                color:LANG===code?'#fff':C.sub,
                border:LANG===code?'none':`1px solid ${C.border}`}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{height:8}}/>
    </div>
  );
};

// ══════════════════════════════════════════════════════════════
// TAB BAR
// ══════════════════════════════════════════════════════════════
const TABS = [
  {id:'home',  icon:'home',  label:()=>t('home')},
  {id:'gifts', icon:'gift',  label:()=>t('gifts')},
  {id:'history',icon:'clock',label:()=>t('history')},
  {id:'orders',icon:'list',  label:()=>t('orders')},
  {id:'profile',icon:'user', label:()=>t('profile')},
];

const TabBar = ({active,onChange,badge}) => (
  <div style={{height:C.tabH,background:C.card,borderTop:`1px solid ${C.border}`,
    display:'flex',alignItems:'center',flexShrink:0,
    paddingBottom:'env(safe-area-inset-bottom,0)'}}>
    {TABS.map(tab=>{
      const on = active===tab.id;
      return (
        <button key={tab.id} className="press"
          onClick={()=>{if(!on){hapticSelect();onChange(tab.id);}}}
          style={{flex:1,height:'100%',display:'flex',flexDirection:'column',
            alignItems:'center',justifyContent:'center',gap:3,
            color:on?C.brand:C.sub,position:'relative'}}>
          <div style={{position:'relative'}}>
            <Icon n={tab.icon} size={22} color={on?C.brand:C.sub}
              sw={on?2.2:1.8}/>
            {badge[tab.id]>0 && (
              <div style={{position:'absolute',top:-2,right:-4,
                minWidth:14,height:14,borderRadius:999,
                background:C.bad,color:'#fff',fontSize:9,fontWeight:800,
                display:'flex',alignItems:'center',justifyContent:'center',
                padding:'0 3px'}}>
                {badge[tab.id]>9?'9+':badge[tab.id]}
              </div>
            )}
          </div>
          <div style={{fontSize:10,fontWeight:on?700:500,letterSpacing:'-0.01em',
            transition:'color 180ms',lineHeight:1}}>
            {tab.label()}
          </div>
        </button>
      );
    })}
  </div>
);

// ══════════════════════════════════════════════════════════════
// APP ROOT
// ══════════════════════════════════════════════════════════════
const App = () => {
  const [tab,setTab] = useState('home');
  const [user,setUser] = useState(null);
  const [userLoading,setUserLoading] = useState(true);
  const [userError,setUserError] = useState(false);
  const [toast,setToast] = useState(null);
  const [ordersBadge,setOrdersBadge] = useState(0);

  const loadUser = useCallback(()=>{
    if(!TG_ID){ setUserLoading(false); setUserError(true); return; }
    api('/webapp/user/').then(d=>{setUser(d);setUserError(false);setUserLoading(false);})
      .catch(()=>{setUserError(true);setUserLoading(false);});
  },[]);

  const loadBadge = useCallback(()=>{
    if(!TG_ID) return;
    api('/webapp/redemptions/').then(d=>{
      const arr = Array.isArray(d)?d:[];
      const n = arr.filter(o=>o.status==='sent').length;
      setOrdersBadge(n);
    }).catch(()=>{});
  },[]);

  useEffect(()=>{ loadUser(); loadBadge(); },[]);
  useEffect(()=>{ if(tab==='orders') loadBadge(); },[tab]);

  const showToast = useCallback((msg,type='success')=>{
    setToast({msg,type,key:Date.now()});
  },[]);

  const handleLangChange = async (lang) => {
    if(lang===LANG) return;
    haptic();
    try {
      await api('/webapp/update-language/',{method:'POST',body:{telegram_id:TG_ID,language:lang}});
      showToast(IS_RU?'Язык изменён, перезагрузите страницу':'Til o\'zgartirildi, sahifani yangilang','success');
    } catch(e) {}
  };

  if(userLoading) return (
    <div style={{position:'fixed',inset:0,display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',gap:12,background:C.bg}}>
      <Spin size={32}/>
      <div style={{fontSize:13,color:C.sub,fontWeight:500}}>{t('loading')}</div>
    </div>
  );

  if(userError||!user) return (
    <div style={{position:'fixed',inset:0,display:'flex',flexDirection:'column',
      alignItems:'center',justifyContent:'center',gap:12,background:C.bg,padding:24}}>
      <Icon n="info" size={48} color={C.faint}/>
      <div style={{fontSize:15,fontWeight:600,color:C.sub,textAlign:'center'}}>{t('error_load')}</div>
      <button className="press" onClick={loadUser}
        style={{padding:'12px 28px',borderRadius:12,background:C.brand,
          color:'#fff',fontSize:14,fontWeight:700}}>
        {t('retry')}
      </button>
    </div>
  );

  const badge = {orders:ordersBadge};
  TABS.forEach(tb=>{ if(!badge[tb.id]) badge[tb.id]=0; });

  return (
    <div style={{position:'fixed',inset:0,display:'flex',flexDirection:'column',
      paddingTop:'env(safe-area-inset-top,0)',background:C.bg}}>
      {/* Content */}
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column',position:'relative'}}>
        {tab==='home'    && <PageHome    user={user} onRefreshUser={loadUser} onTab={setTab} showToast={showToast}/>}
        {tab==='gifts'   && <PageGifts   user={user} onRefreshUser={loadUser} showToast={showToast}/>}
        {tab==='history' && <PageHistory/>}
        {tab==='orders'  && <PageOrders  showToast={showToast} onRefreshUser={loadUser}/>}
        {tab==='profile' && <PageProfile user={user} onLangChange={handleLangChange}/>}
      </div>

      {/* Tab bar */}
      <TabBar active={tab} onChange={setTab} badge={badge}/>

      {/* Toast */}
      {toast && <Toast key={toast.key} msg={toast.msg} type={toast.type} onHide={()=>setToast(null)}/>}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
