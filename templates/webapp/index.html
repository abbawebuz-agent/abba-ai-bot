{% load static %}<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate,max-age=0,private"/>
<title>JIP — Sodiqlik dasturi</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--primary-d:#1d4ed8;--success:#10b981;--warning:#f59e0b;--danger:#ef4444;--bg:#f4f5f8;--card:#fff;--text:#0e0e12;--sub:#6b7280;--border:#ececf1;--r:18px;--xs:0 1px 2px rgba(16,18,32,.05);--sm:0 2px 8px rgba(16,18,32,.06);--md:0 10px 30px -12px rgba(16,18,32,.18);--grad:0 16px 36px -14px rgba(37,99,235,.55);}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;font-family:'Inter',ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
.content{position:fixed;inset:0 0 82px 0;overflow-y:auto;overflow-x:hidden;padding:8px 16px 24px;scrollbar-width:none;}
.content::-webkit-scrollbar{display:none;}
.fade-in{animation:fade .32s cubic-bezier(.32,.72,0,1);}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);z-index:100;}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-txt{font-size:14px;color:var(--sub);font-weight:500;}
.err-ico{width:64px;height:64px;border-radius:20px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;box-shadow:var(--sm);}
.err-ico svg{width:32px;height:32px;color:#cccfd8;}
.btn-retry{margin-top:4px;height:44px;padding:0 24px;border-radius:14px;background:var(--primary);color:#fff;font-family:inherit;font-size:14px;font-weight:700;border:none;cursor:pointer;}
/* tabbar */
.tabbar{position:fixed;left:12px;right:12px;bottom:8px;height:68px;background:rgba(255,255,255,.88);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.6);border-radius:26px;box-shadow:0 12px 30px -10px rgba(16,18,32,.22);display:flex;padding:8px;z-index:20;}
.tab{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--sub);cursor:pointer;position:relative;border-radius:18px;transition:color .2s,background .2s;}
.tab svg{width:23px;height:23px;transition:transform .2s;}
.tab span{font-size:9.5px;font-weight:600;letter-spacing:-.01em;}
.tab.active{color:var(--primary);background:rgba(37,99,235,.1);}
.tab.active svg{transform:translateY(-1px);}
.tab .badge{position:absolute;top:5px;right:calc(50% - 20px);min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;}
/* hero */
.hero{border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;margin-top:6px;background:linear-gradient(135deg,#3b82f6 0%,#2563eb 52%,#1d4ed8 100%);box-shadow:var(--grad);}
.hero .b1{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.55),transparent 70%);top:-90px;right:-60px;pointer-events:none;}
.hero .b2{position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);bottom:-80px;left:-40px;pointer-events:none;}
.hero-row1{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:2;}
.hero-logo{height:28px;width:auto;display:block;filter:brightness(0) invert(1);}
.hero-user{display:flex;align-items:center;gap:12px;margin-top:18px;position:relative;z-index:2;}
.avatar{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#fdba74,#f97316);display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;flex-shrink:0;box-shadow:0 4px 12px rgba(249,115,22,.4);}
.hero-name{font-size:18px;font-weight:700;line-height:1.05;}
.hero-prog{font-size:9.5px;font-weight:700;letter-spacing:.12em;opacity:.8;margin-top:3px;}
.hero-id{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;backdrop-filter:blur(4px);}
.hero-bal{position:relative;z-index:2;margin-top:22px;}
.hero-bal .row{display:flex;align-items:baseline;gap:9px;}
.hero-bal .num{font-size:52px;font-weight:900;letter-spacing:-.04em;line-height:.9;}
.hero-bal .lbl{font-size:16px;font-weight:600;opacity:.85;}
.hero-bal .cap{font-size:11px;font-weight:600;letter-spacing:.04em;opacity:.7;margin-top:8px;display:flex;align-items:center;gap:6px;}
/* banner */
.banner{position:relative;border-radius:22px;overflow:hidden;height:112px;margin-top:14px;box-shadow:var(--sm);}
.banner-track{display:flex;height:100%;transition:transform .55s cubic-bezier(.32,.72,0,1);}
.slide{flex:0 0 100%;height:100%;padding:18px 20px;display:flex;flex-direction:column;justify-content:center;color:#fff;position:relative;overflow:hidden;}
.slide .glow{position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.16);top:-50px;right:-40px;}
.slide .s-emoji{font-size:23px;}
.slide .s-title{font-size:18.5px;font-weight:800;letter-spacing:-.02em;margin-top:5px;position:relative;z-index:2;}
.slide .s-sub{font-size:12.5px;opacity:.92;margin-top:3px;position:relative;z-index:2;}
.sl-1{background:linear-gradient(120deg,#7c3aed,#3b82f6);}
.sl-2{background:linear-gradient(120deg,#ea580c,#fb923c);}
.sl-3{background:linear-gradient(120deg,#059669,#34d399);}
.dots{position:absolute;bottom:11px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3;}
.dots i{width:6px;height:6px;border-radius:999px;background:rgba(255,255,255,.5);transition:all .3s;display:block;}
.dots i.on{width:20px;background:#fff;}
/* promo */
.pk-head{display:flex;align-items:center;gap:12px;padding:18px 16px 14px;}
.pk-ico{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,rgba(37,99,235,.14),rgba(59,130,246,.14));color:var(--primary);display:grid;place-items:center;flex-shrink:0;}
.pk-ico svg{width:22px;height:22px;}
.pk-head h3{margin:0;font-size:15px;font-weight:700;}
.pk-head p{margin:2px 0 0;font-size:11.5px;color:var(--sub);}
.pk-body{padding:0 16px 16px;display:flex;gap:9px;}
.pk-input{flex:1;min-width:0;height:48px;border:1.5px solid var(--border);border-radius:14px;background:#f7f7fa;padding:0 15px;font-size:14px;font-family:inherit;font-weight:500;color:var(--text);transition:.18s;}
.pk-input::placeholder{color:#a2a6b0;font-weight:400;}
.pk-input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12);}
.btn{height:48px;border-radius:14px;border:none;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary{background:var(--primary);color:#fff;padding:0 18px;box-shadow:0 8px 18px -8px rgba(37,99,235,.7);}
.btn-primary:active{transform:scale(.97);}
.btn:disabled{background:#eceef2;color:#a2a6b0;cursor:not-allowed;box-shadow:none;}
.order-actions{display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.btn-sm{height:36px;border-radius:10px;font-size:12.5px;font-weight:700;border:none;font-family:inherit;cursor:pointer;padding:0 14px;transition:.18s;}
.btn-sm:active{transform:scale(.96);}
.btn-sm:disabled{opacity:.55;cursor:not-allowed;}
.btn-sm-danger{background:#fef2f2;color:var(--danger);}
.btn-sm-green{background:#f0fdf4;color:var(--success);}
.btn-outline{width:100%;border:1.5px solid var(--primary);color:var(--primary);background:rgba(37,99,235,.04);height:54px;border-radius:16px;font-size:15px;margin-top:14px;}
.btn-outline:active{transform:scale(.99);}
.pk-go{width:48px;flex:0 0 48px;padding:0;}
.pk-go svg{width:22px;height:22px;}
/* card */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--xs);}
/* leaderboard */
.lb-head{display:flex;align-items:center;gap:12px;padding:16px 16px 8px;}
.lb-ico{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,rgba(245,158,11,.16),rgba(249,115,22,.16));color:#f59e0b;display:grid;place-items:center;flex-shrink:0;}
.lb-ico svg{width:22px;height:22px;}
.lb-head h3{margin:0;font-size:15px;font-weight:700;}
.lb-head p{margin:2px 0 0;font-size:11.5px;color:var(--sub);}
.lb-all{margin-left:auto;background:none;border:none;color:var(--primary);font-weight:700;font-size:12.5px;cursor:pointer;flex-shrink:0;padding:6px 4px;}
.lb-rows{padding:2px 8px 6px;display:flex;flex-direction:column;}
.lb-row{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:13px;}
.lb-rank{width:26px;text-align:center;font-weight:800;font-size:13.5px;color:#9aa0ab;flex-shrink:0;}
.lb-rank.medal{font-size:17px;}
.lb-av{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:12.5px;flex-shrink:0;}
.lb-name{flex:1;font-size:13.5px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb-pts{font-size:14px;font-weight:800;color:var(--primary);flex-shrink:0;white-space:nowrap;}
.lb-pts span{font-size:11px;color:var(--sub);font-weight:600;margin-left:3px;}
.lb-you{display:flex;align-items:center;gap:11px;padding:11px 12px;margin:2px 10px 12px;border-radius:14px;background:rgba(37,99,235,.06);border:1px dashed rgba(37,99,235,.32);}
/* contact */
.contact-head{display:flex;align-items:center;gap:12px;padding:18px 16px 10px;}
.contact-row{display:flex;align-items:center;gap:12px;padding:14px;margin:0 10px 10px;border-radius:16px;background:#f7f7fa;cursor:pointer;transition:.15s;}
.contact-row:active{transform:scale(.99);}
.tg-ico{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#2aabee,#229ed9);display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 10px rgba(34,158,217,.35);}
.tg-ico svg{width:21px;height:21px;color:#fff;}
.c-main{flex:1;}
.c-name{font-size:14px;font-weight:700;}
.c-sub{font-size:11.5px;color:var(--sub);margin-top:1px;}
.chev{color:#c8cad2;flex-shrink:0;}
/* gifts */
.page-title{font-size:25px;font-weight:800;letter-spacing:-.03em;margin:14px 2px 4px;}
.section-sub{font-size:13px;color:var(--sub);font-weight:500;margin:0 2px 16px;}
.ord-info{background:linear-gradient(135deg,#eef4ff,#f4ecff);border:1px solid #d9e2ff;border-radius:14px;padding:14px 16px;margin:0 2px 16px;font-size:13.5px;line-height:1.5;color:#3a4a6b;font-weight:500;}
.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;}
.gift-card{background:var(--card);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--xs);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;}
.gift-card:active{transform:scale(.97);}
.gift-img{height:112px;display:grid;place-items:center;position:relative;overflow:hidden;}
.gift-img::after{content:"";position:absolute;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.16);top:-30px;right:-26px;}
.gift-img svg{width:46px;height:46px;color:rgba(255,255,255,.95);position:relative;z-index:2;}
.gi-1{background:linear-gradient(135deg,#60a5fa,#2563eb);}
.gi-2{background:linear-gradient(135deg,#f472b6,#ec4899);}
.gi-3{background:linear-gradient(135deg,#38bdf8,#0ea5e9);}
.gi-4{background:linear-gradient(135deg,#fbbf24,#f59e0b);}
.gi-5{background:linear-gradient(135deg,#34d399,#10b981);}
.gift-info{padding:12px 13px 14px;display:flex;flex-direction:column;gap:9px;flex:1;}
.gift-name{font-size:13.5px;font-weight:700;line-height:1.25;}
.gift-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:auto;}
.pts-badge{background:rgba(37,99,235,.1);color:var(--primary);font-size:12px;font-weight:800;padding:4px 10px;border-radius:9px;}
.need-badge{color:var(--danger);font-size:11px;font-weight:700;}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(11,11,18,.5);backdrop-filter:blur(2px);z-index:30;opacity:0;pointer-events:none;transition:opacity .32s;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:30px 30px 0 0;z-index:31;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);padding:12px 22px 36px;max-height:90vh;overflow-y:auto;scrollbar-width:none;box-shadow:0 -20px 50px -20px rgba(16,18,32,.3);}
.sheet::-webkit-scrollbar{display:none;}
.sheet.show{transform:translateY(0);}
.handle{width:42px;height:5px;border-radius:999px;background:#dadce3;margin:4px auto 18px;}
.sheet-img{width:130px;height:130px;border-radius:26px;margin:0 auto 16px;display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:var(--md);}
.sheet-img::after{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.18);top:-30px;right:-30px;}
.sheet-img svg{width:56px;height:56px;color:#fff;position:relative;z-index:2;}
.sheet-name{font-size:21px;font-weight:800;text-align:center;letter-spacing:-.02em;}
.sheet-desc{font-size:13.5px;color:var(--sub);text-align:center;margin:7px 4px 20px;line-height:1.5;}
.info-rows{display:flex;flex-direction:column;gap:1px;background:var(--border);border-radius:18px;overflow:hidden;}
.info-row{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;background:#fafafc;font-size:14px;}
.info-row .ir-lbl{color:var(--sub);font-weight:500;}
.info-row .ir-val{font-weight:800;}
.info-row .ir-val.red{color:var(--danger);}
.warn-text{color:var(--danger);font-size:13.5px;font-weight:700;text-align:center;margin:18px 0;display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-block{width:100%;height:54px;border-radius:16px;font-size:15.5px;}
/* history */
.hist-item{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--border);}
.hist-item:last-child{border-bottom:none;}
.hist-ico{width:44px;height:44px;border-radius:14px;background:rgba(37,99,235,.1);color:var(--primary);display:grid;place-items:center;flex-shrink:0;}
.hist-ico svg{width:22px;height:22px;}
.hist-code{font-size:14px;font-weight:700;}
.hist-date{font-size:11.5px;color:var(--sub);margin-top:2px;}
.hist-pts{font-size:15px;font-weight:800;color:var(--success);white-space:nowrap;}
/* orders */
.order-card{padding:18px 16px;margin-bottom:12px;}
.order-row{display:flex;align-items:center;gap:13px;}
.order-img{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;flex-shrink:0;box-shadow:var(--sm);}
.order-img svg{width:26px;height:26px;color:#fff;}
.order-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.order-top h3{margin:0;font-size:15px;font-weight:700;}
.sp{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px;white-space:nowrap;}
.sp-blue{background:rgba(59,130,246,.13);color:#2563eb;}
.sp-green{background:rgba(16,185,129,.13);color:#10b981;}
.sp-red{background:rgba(239,68,68,.13);color:#ef4444;}
.sp-gray{background:rgba(107,114,128,.13);color:#6b7280;}
.order-date{font-size:12px;color:var(--sub);margin-top:4px;font-weight:500;}
.steps{display:flex;margin-top:26px;}
.step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;}
.step-line{position:absolute;top:14px;left:-50%;width:100%;height:3px;background:#e7e8ee;z-index:0;border-radius:2px;}
.step-line.done{background:var(--primary);}
.step.first .step-line{display:none;}
.step-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:2;background:#e7e8ee;color:#fff;flex-shrink:0;}
.step-dot svg{width:16px;height:16px;}
.step-dot.done{background:var(--primary);box-shadow:0 4px 10px -3px rgba(37,99,235,.6);}
.step-dot.active{background:var(--primary);animation:pulse 1.6s infinite;}
.step-dot.active i{width:10px;height:10px;border-radius:50%;background:#fff;display:block;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,99,235,.5)}70%{box-shadow:0 0 0 10px rgba(37,99,235,0)}100%{box-shadow:0 0 0 0 rgba(37,99,235,0)}}
.step-lbl{font-size:10px;font-weight:600;margin-top:9px;text-align:center;color:var(--sub);line-height:1.2;max-width:64px;}
.step-lbl.done{color:var(--text);}
.step-lbl.active{color:var(--primary);font-weight:700;}
/* empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 24px;}
.empty-ico{width:96px;height:96px;border-radius:28px;background:#fff;border:1px solid var(--border);display:grid;place-items:center;margin-bottom:22px;box-shadow:var(--sm);}
.empty-ico svg{width:48px;height:48px;color:#cccfd8;}
.empty h4{margin:0 0 7px;font-size:17px;font-weight:700;color:#3f434c;}
.empty p{margin:0;font-size:13.5px;color:var(--sub);}
/* profile */
.prof-top{display:flex;align-items:center;gap:15px;padding:16px 4px 20px;}
.prof-top .avatar{width:70px;height:70px;border-radius:24px;font-size:25px;}
.prof-name{font-size:22px;font-weight:800;letter-spacing:-.02em;}
.prof-handle{font-size:13.5px;color:var(--sub);margin-top:2px;}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:16px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 8px;text-align:center;box-shadow:var(--xs);}
.stat .s-num{font-size:26px;font-weight:900;letter-spacing:-.03em;line-height:1;}
.stat .s-lbl{font-size:11px;color:var(--sub);font-weight:600;margin-top:6px;}
.s-indigo .s-num{color:var(--primary);}
.s-green .s-num{color:var(--success);}
.s-amber .s-num{color:var(--warning);}
.inforow{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--border);}
.inforow:last-child{border-bottom:none;}
.ir-ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;}
.ir-ico svg{width:19px;height:19px;}
.iri-1{background:rgba(37,99,235,.1);color:var(--primary);}
.iri-2{background:rgba(16,185,129,.11);color:var(--success);}
.iri-3{background:rgba(42,171,238,.13);color:#229ed9;}
.iflex{flex:1;}
.if-lbl{font-size:11.5px;color:var(--sub);font-weight:500;}
.if-val{font-size:14.5px;font-weight:700;margin-top:1px;}
.if-val.link{color:var(--primary);}
.lang-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;}
.lang-head h3{margin:0;font-size:15px;font-weight:700;}
.lang-btns{display:flex;gap:11px;padding:0 16px 16px;}
.lang-btn{flex:1;height:50px;border-radius:15px;font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.18s;}
.lang-btn.on{background:var(--primary);color:#fff;border:1.5px solid var(--primary);box-shadow:0 8px 18px -8px rgba(37,99,235,.7);}
.lang-btn.off{background:#fff;color:var(--sub);border:1.5px solid var(--border);}
.brand-foot{text-align:center;padding:28px 0 10px;}
.brand-foot img{height:30px;width:auto;opacity:.85;}
.bf-txt{font-size:12px;font-weight:700;color:var(--sub);margin-top:9px;letter-spacing:.02em;}
.bf-sub{font-size:11px;color:#9aa0ab;margin-top:3px;}
/* toast */

const svg=(p,x='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${x}>${p}</svg>`;
const GC=['gi-1','gi-2','gi-3','gi-4','gi-5'];
const RC=['linear-gradient(135deg,#fbbf24,#f59e0b)','linear-gradient(135deg,#64748b,#94a3b8)','linear-gradient(135deg,#c2842a,#a86a1c)','linear-gradient(135deg,#60a5fa,#2563eb)','linear-gradient(135deg,#34d399,#10b981)','linear-gradient(135deg,#a78bfa,#7c3aed)','linear-gradient(135deg,#f87171,#ef4444)','linear-gradient(135deg,#fb923c,#ea580c)'];
const MEDALS=['🥇','🥈','🥉'];
const DEF_SLIDES=[
  {cls:'sl-1',e:'🚀',t:IS_RU?'Новая акция! 2x балла':'Yangi aksiya! 2x ball',s:IS_RU?'За каждый промокод вдвое':"Har bir promokod uchun ikki barobar"},
  {cls:'sl-2',e:'🏆',t:IS_RU?'Войдите в Топ-10':'Top-10 ga kiring',s:IS_RU?'Активные мастера получают призы':"Eng faol ustalar sovrin oladi"},
  {cls:'sl-3',e:'🎁',t:IS_RU?'Подарки обновлены':"Sovg'alar yangilandi",s:IS_RU?'Смотрите новые награды':"Yangi mukofotlarni ko'ring"},
];
function gCol(id){return GC[(id-1)%5];}
function gIco(name){const n=(name||'').toLowerCase();if(n.includes('kepka')||n.includes('кепка'))return 'cap';if(n.includes('футболка')||n.includes('futbolka'))return 'shirt';if(n.includes('термос')||n.includes('termos'))return 'thermos';if(n.includes('набор')||n.includes('инструмент')||n.includes('asbob'))return 'tools';if(n.includes('сумка')||n.includes('sumka'))return 'bag';return 'gift';}
function ini(u){if(!u)return '?';return((u.first_name||'')+' '+(u.last_name||'')).trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?';}
function pts(n){return(n||0).toLocaleString('ru-RU');}
function fname(u){return[u?.first_name,u?.last_name].filter(Boolean).join(' ')||u?.username||'Santexnik';}
function fdate(s){return s?new Date(s).toLocaleDateString('ru-RU'):'';}
let S={user:null,gifts:[],history:[],orders:[],top:[],contact:null,banners:[]};
const BASE='/api/webapp';
async function apiGet(p){const r=await fetch(BASE+p,{headers:{Accept:'application/json'}});if(!r.ok)throw r.status;return r.json();}
async function apiPost(p,b){const r=await fetch(BASE+p,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(b)});return{ok:r.ok,data:await r.json().catch(()=>({}))};}
const toastEl=document.getElementById('toast');
let toastTm;
function toast(msg,type=''){toastEl.textContent=msg;toastEl.className='toast '+(type==='ok'?'ok':type==='err'?'err':'')+' show';clearTimeout(toastTm);toastTm=setTimeout(()=>toastEl.classList.remove('show'),2800);}
function spInfo(status){return({pending:{pill:'sp-blue',lbl:IS_RU?'На рассмотрении':'Kutilmoqda'},approved:{pill:'sp-blue',lbl:IS_RU?'Одобрено':'Tasdiqlandi'},sent:{pill:'sp-green',lbl:IS_RU?'Готов к выдаче':'Berishga tayyor'},completed:{pill:'sp-green',lbl:IS_RU?'Получено':'Olindi'},rejected:{pill:'sp-red',lbl:IS_RU?'Отклонено':'Rad etildi'},cancelled_by_user:{pill:'sp-gray',lbl:IS_RU?'Отменено':'Bekor qilindi'},not_received:{pill:'sp-red',lbl:IS_RU?'Не получено':'Yetib kelmadi'}})[status]||{pill:'sp-gray',lbl:status};}
/* screens */
function homeScreen(){
  const u=S.user,bal=u?.points||0,in_=ini(u),fn=fname(u);
  const slides=S.banners.length?S.banners.map((b,i)=>`<div class="slide sl-${(i%3)+1}"><div class="glow"></div><div class="s-emoji">${b.emoji||'🎁'}</div><div class="s-title">${b.title||''}</div><div class="s-sub">${b.subtitle||''}</div></div>`):DEF_SLIDES.map(s=>`<div class="slide ${s.cls}"><div class="glow"></div><div class="s-emoji">${s.e}</div><div class="s-title">${s.t}</div><div class="s-sub">${s.s}</div></div>`);
  const topHtml=S.top.length?`<div class="card" style="margin-top:14px;"><div class="lb-head"><div class="lb-ico">${svg(I.trophy)}</div><div style="flex:1;min-width:0;"><h3>${T.top_h}</h3><p>${T.top_s}</p></div></div><div class="lb-rows">${S.top.slice(0,5).map((p,i)=>`<div class="lb-row"><div class="lb-rank ${i<3?'medal':''}">${i<3?MEDALS[i]:i+1}</div><div class="lb-av" style="background:${RC[i]}">${ini({first_name:p.name||p.first_name})}</div><div class="lb-name">${p.name||p.first_name||'—'}</div><div class="lb-pts">${pts(p.points)}<span>ball</span></div></div>`).join('')}</div>${u?`<div class="lb-you"><div class="lb-rank">—</div><div class="lb-av" style="background:linear-gradient(135deg,#fdba74,#f97316)">${in_}</div><div class="lb-name">${fn} · <span style="color:var(--sub);font-weight:600">${T.you}</span></div><div class="lb-pts">${pts(bal)}<span>ball</span></div></div>`:''}</div>`:'';
  const conHtml=S.contact?`<div class="card" style="margin-top:14px;"><div class="contact-head"><div class="pk-ico">${svg(I.send)}</div><div><h3 style="margin:0;font-size:15px;font-weight:700;">${T.con_h}</h3><p style="margin:2px 0 0;font-size:11.5px;color:var(--sub);">${T.con_s}</p></div></div><div class="contact-row" onclick="openContact()"><div class="tg-ico">${svg(I.telegram)}</div><div class="c-main"><div class="c-name">${S.contact.contact_value||'Admin'}</div><div class="c-sub">${T.con_tg}</div></div><div class="chev">${svg(I.chev)}</div></div></div>`:'';
  return `<div class="hero"><div class="b1"></div><div class="b2"></div><div class="hero-row1"><img src="${LOGO}" class="hero-logo" alt="JIP"/><div class="hero-id">ID ${u?.telegram_id||TG_ID||'—'}</div></div><div class="hero-user"><div class="avatar">${in_}</div><div><div class="hero-name">${fn}</div><div class="hero-prog">${T.loyalty}</div></div></div><div class="hero-bal"><div class="row"><span class="num">${pts(bal)}</span><span class="lbl">ball</span></div><div class="cap">${svg(I.spark,'width="12" height="12"')} ${T.hint}</div></div></div><div class="banner" data-banner><div class="banner-track">${slides.join('')}</div><div class="dots">${slides.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join('')}</div></div><div class="card" style="margin-top:14px;"><div class="pk-head"><div class="pk-ico">${svg(I.qr)}</div><div><h3>${T.promo_h}</h3><p>${T.promo_s}</p></div></div><div class="pk-body"><input class="pk-input" placeholder="${T.promo_ph}" data-pk/><button class="btn btn-primary pk-go" data-pk-btn disabled>${svg(I.check)}</button></div></div><button class="btn btn-outline" data-goto="gifts">${T.all_gifts}</button>${topHtml}${conHtml}`;
}
function giftsScreen(){
  const bal=S.user?.points||0;
  if(!S.gifts.length)return `<div class="page-title">${T.gifts_h}</div><div class="empty"><div class="empty-ico">${svg(I.gift)}</div><h4>${IS_RU?'Подарков пока нет':"Sovg'alar yo'q"}</h4><p>${IS_RU?'Скоро появятся новые подарки':"Tez orada yangi sovg'alar"}</p></div>`;
  return `<div class="page-title">${T.gifts_h}</div><div class="section-sub">${T.gifts_s}</div><div class="gift-grid">${S.gifts.map(g=>{const n=IS_RU?(g.name_ru||g.name_uz_latin||g.name):(g.name_uz_latin||g.name_ru||g.name);const need=g.points_cost-bal;return `<div class="gift-card" data-gift="${g.id}"><div class="gift-img ${gCol(g.id)}">${svg(I[gIco(n)]||I.gift)}</div><div class="gift-info"><div class="gift-name">${n}</div><div class="gift-meta"><span class="pts-badge">${g.points_cost} ball</span>${need>0?`<span class="need-badge">+${need} ${T.not_enough}</span>`:''}</div></div></div>`;}).join('')}</div>`;
}
function historyScreen(){
  if(!S.history.length)return `<div class="page-title">${T.hist_h}</div><div class="empty"><div class="empty-ico">${svg(I.qr)}</div><h4>${T.hist_e}</h4><p>${T.hist_es}</p></div>`;
  return `<div class="page-title">${T.hist_h}</div><div class="card" style="margin-top:8px;">${S.history.map(h=>`<div class="hist-item"><div class="hist-ico">${svg(I.qr)}</div><div style="flex:1;"><div class="hist-code">${h.code||h.qr_code||'—'}</div><div class="hist-date">${h.scanned_at||h.date||''}</div></div><div class="hist-pts">+${h.points||h.points_earned||0} ball</div></div>`).join('')}</div>`;

function ordersScreen(){
  const banner=`<div class="ord-info">${T.ord_info}</div>`;
  if(!S.orders.length)return `<div class="page-title">${T.ord_h}</div>${banner}<div class="empty"><div class="empty-ico">${svg(I.list)}</div><h4>${T.ord_e}</h4><p>${T.ord_es}</p></div>`;

function profileScreen(){

}
/* app */
const content=document.querySelector('[data-content]');
const tabbar=document.querySelector('[data-tabbar]');
const overlay=document.querySelector('[data-overlay]');
const sheet=document.querySelector('[data-sheet]');
let bannerTm=null;
const TABS=[
  {id:'home',lbl:IS_RU?'Главная':'Asosiy',ico:'home'},
  {id:'gifts',lbl:IS_RU?'Подарки':"Sovg'alar",ico:'gift'},
  {id:'history',lbl:IS_RU?'История':'Tarix',ico:'clock'},
  {id:'orders',lbl:IS_RU?'Заявки':"So'rovlar",ico:'list'},
  {id:'profile',lbl:IS_RU?'Профиль':'Profil',ico:'user'},
];
const SCREENS={home:homeScreen,gifts:giftsScreen,history:historyScreen,orders:ordersScreen,profile:profileScreen};
function buildTabbar(){
  const cnt=S.orders.filter(o=>o.status==='sent').length;
  tabbar.innerHTML=TABS.map(t=>`<button class="tab" data-tab="${t.id}">${svg(I[t.ico])}<span>${t.lbl}</span>${t.id==='orders'&&cnt>0?`<span class="badge">${cnt}</span>`:''}</button>`).join('');
  tabbar.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{closeSheet();render(b.dataset.tab);}));
}
function render(tab){
  if(bannerTm){clearInterval(bannerTm);bannerTm=null;}
  content.innerHTML=SCREENS[tab]();
  content.classList.remove('fade-in');void content.offsetWidth;content.classList.add('fade-in');
  content.scrollTop=0;
  tabbar.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  wire(tab);
}
function wire(tab){
  const pk=content.querySelector('[data-pk]'),pkBtn=content.querySelector('[data-pk-btn]');
  if(pk&&pkBtn){
    pk.addEventListener('input',()=>pkBtn.disabled=!pk.value.trim());
    pkBtn.addEventListener('click',async()=>{
      const code=pk.value.trim();if(!code||!TG_ID)return;
      pkBtn.disabled=true;pk.disabled=true;haptic();
      const res=await apiPost('/register-qr/',{telegram_id:TG_ID,qr_code:code});
      pk.disabled=false;pk.value='';
      if(res.ok){hapticOk();toast(`✅ +${res.data.points||0} ball!`,'ok');S.user=await apiGet(`/user/?telegram_id=${TG_ID}&format=json`).catch(()=>S.user);buildTabbar();render('home');}
      else{hapticErr();toast('⚠ '+(res.data?.error||(IS_RU?'Неверный промокод':"Noto'g'ri promokod")),'err');pkBtn.disabled=false;}
    });
  }
  content.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click',()=>{closeSheet();render(b.dataset.goto);}));
  const banner=content.querySelector('[data-banner]');
  if(banner){const track=banner.querySelector('.banner-track');const dots=banner.querySelectorAll('.dots i');const n=track.children.length;if(n>1){let idx=0;bannerTm=setInterval(()=>{idx=(idx+1)%n;track.style.transform=`translateX(-${idx*100}%)`;dots.forEach((d,i)=>d.classList.toggle('on',i===idx));},2800);}}
  content.querySelectorAll('[data-gift]').forEach(c=>c.addEventListener('click',()=>openSheet(+c.dataset.gift)));
  content.querySelectorAll('[data-lang]').forEach(btn=>btn.addEventListener('click',async()=>{
    const lang=btn.dataset.lang;
    content.querySelectorAll('[data-lang]').forEach(b=>{b.classList.remove('on');b.classList.add('off');});
    btn.classList.remove('off');btn.classList.add('on');haptic();
    const lr=await apiPost('/update-language/',{telegram_id:TG_ID,language:lang});
    if(lr.ok){window.location.reload();}else{toast(IS_RU?'Xato':'Ошибка','err');}
  }));
  content.querySelectorAll('[data-cancel]').forEach(btn=>btn.addEventListener('click',async()=>{
    const id=+btn.dataset.cancel;if(!TG_ID)return;btn.disabled=true;haptic();
    const res=await apiPost('/cancel-order/',{redemption_id:id,telegram_id:TG_ID});
    if(res.ok){hapticOk();toast(IS_RU?'✅ Отменено':'✅ Bekor qilindi','ok');S.orders=await apiGet(`/redemptions/?telegram_id=${TG_ID}&format=json`).catch(()=>S.orders);S.user=await apiGet(`/user/?telegram_id=${TG_ID}&format=json`).catch(()=>S.user);buildTabbar();render('orders');}
    else{hapticErr();toast('⚠ '+(res.data?.error||(IS_RU?'Ошибка':'Xato')),'err');btn.disabled=false;}
  }));
  content.querySelectorAll('[data-confirm]').forEach(btn=>btn.addEventListener('click',async()=>{
    const id=+btn.dataset.confirm;btn.disabled=true;haptic();
    const res=await apiPost('/confirm-delivery/',{redemption_id:id,confirmed:true});
    if(res.ok){hapticOk();toast(IS_RU?'✅ Подтверждено':'✅ Tasdiqlandi','ok');S.orders=await apiGet(`/redemptions/?telegram_id=${TG_ID}&format=json`).catch(()=>S.orders);buildTabbar();render('orders');}
    else{hapticErr();toast('⚠ '+(res.data?.error||(IS_RU?'Ошибка':'Xato')),'err');btn.disabled=false;}
  }));
  content.querySelectorAll('[data-notrcv]').forEach(btn=>btn.addEventListener('click',async()=>{
    const id=+btn.dataset.notrcv;btn.disabled=true;haptic();
    const res=await apiPost('/confirm-delivery/',{redemption_id:id,confirmed:false});
    if(res.ok){hapticOk();toast(IS_RU?'✅ Принято':'✅ Qabul qilindi','ok');S.orders=await apiGet(`/redemptions/?telegram_id=${TG_ID}&format=json`).catch(()=>S.orders);buildTabbar();render('orders');}
    else{hapticErr();toast('⚠ '+(res.data?.error||(IS_RU?'Ошибка':'Xato')),'err');btn.disabled=false;}
  }));
}
function openSheet(id){
  const g=S.gifts.find(x=>x.id===id);if(!g)return;haptic('medium');
  const bal=S.user?.points||0,need=g.points_cost-bal;
  const n=IS_RU?(g.name_ru||g.name_uz_latin||g.name):(g.name_uz_latin||g.name_ru||g.name);
  const d=g.description||'';
  sheet.innerHTML=`<div class="handle"></div><div class="sheet-img ${gCol(g.id)}">${svg(I[gIco(n)]||I.gift)}</div><div class="sheet-name">${n}</div>${d?`<div class="sheet-desc">${d}</div>`:''}<div class="info-rows"><div class="info-row"><span class="ir-lbl">${T.bal_lbl}</span><span class="ir-val">${pts(bal)} ball</span></div><div class="info-row"><span class="ir-lbl">${T.cost_lbl}</span><span class="ir-val red">−${g.points_cost} ball</span></div><div class="info-row"><span class="ir-lbl">${T.after_lbl}</span><span class="ir-val red">${pts(bal-g.points_cost)} ball</span></div></div>${need>0?`<div class="warn-text">⚠ ${need} ${T.not_enough}</div>`:''}<button class="btn btn-primary btn-block" id="sbtn" ${need>0?'disabled':''}>${T.exchange}</button>`;
  overlay.classList.add('show');sheet.classList.add('show');
  document.getElementById('sbtn')?.addEventListener('click',async()=>{
    if(!TG_ID)return;const btn=document.getElementById('sbtn');btn.disabled=true;btn.textContent=IS_RU?'Отправка...':'Yuborilmoqda...';haptic('medium');
    const res=await apiPost('/request-gift/',{telegram_id:TG_ID,gift_id:g.id});
    if(res.ok){hapticOk();closeSheet();toast(IS_RU?'✅ Заявка отправлена!':"✅ So'rov yuborildi!",'ok');S.orders=await apiGet(`/redemptions/?telegram_id=${TG_ID}&format=json`).catch(()=>S.orders);S.user=await apiGet(`/user/?telegram_id=${TG_ID}&format=json`).catch(()=>S.user);buildTabbar();render('orders');}
    else{hapticErr();toast('⚠ '+(res.data?.error||(IS_RU?'Ошибка':'Xato')),'err');btn.disabled=false;btn.textContent=T.exchange;}
  });
}
function closeSheet(){overlay.classList.remove('show');sheet.classList.remove('show');}
overlay.addEventListener('click',closeSheet);
function openContact(){
  if(!S.contact)return;haptic();
  const v=S.contact.contact_value||'';
  let url=v.startsWith('https://')?v:v.match(/^\+?[0-9]+$/)?`tel:${v}`:`https://t.me/${v.replace('@','')}`;
  tg?tg.openLink(url):window.open(url,'_blank');
}
window.openContact=openContact;
async function init(){
  if(!TG_ID){content.innerHTML=`<div class="splash"><div class="err-ico">${svg(I.info)}</div><div class="splash-txt">${IS_RU?'Откройте через Telegram бот':'Telegram bot orqali oching'}</div></div>`;return;}
  content.innerHTML=`<div class="splash"><div class="spin"></div><div class="splash-txt">${T.loading}</div></div>`;
  try{
    const[user,gifts,history,orders,topRaw,conRaw,bannersRaw]=await Promise.all([
      apiGet(`/user/?telegram_id=${TG_ID}&format=json`),
      apiGet(`/gifts/?telegram_id=${TG_ID}&format=json`),
      apiGet(`/qr-history/?telegram_id=${TG_ID}&format=json`),
      apiGet(`/redemptions/?telegram_id=${TG_ID}&format=json`),
      apiGet(`/top-users/?format=json`),
      apiGet(`/admin-contact/?telegram_id=${TG_ID}&format=json`),
      apiGet(`/promotions/?telegram_id=${TG_ID}&format=json`),
    ]);
    S.user=user;
    S.gifts=Array.isArray(gifts)?gifts:[];
    S.history=Array.isArray(history)?history:(history?.results||[]);
    S.orders=Array.isArray(orders)?orders:(orders?.results||[]);
    S.top=topRaw?.items||[];
    S.contact=(conRaw?.contacts?.length?conRaw.contacts[0]:null)||(conRaw?.contact_value?conRaw:null);
    S.banners=Array.isArray(bannersRaw)?bannersRaw:[];
    buildTabbar();render('home');
  }catch(e){
    content.innerHTML=`<div class="splash"><div class="err-ico">${svg(I.info)}</div><div class="splash-txt">${T.error}</div><button class="btn-retry" onclick="init()">${T.retry}</button></div>`;
  }
}
window.init=init;
init();
</script>
