<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>JIP GROUP — Sodiqlik dasturi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>

  :root {
    --bg: #FFFFFF;
    --surface: #F4F5F8;
    --surface-2: #FFFFFF;
    --nav-bg: rgba(255,255,255,.84);
    --ink: #16171D;
    --ink-2: #6A6E7A;
    --ink-3: #A2A6B2;
    --line: #ECEDF1;
    --track: #ECEDF1;
    /* brand accent (switchable via Tweaks) — blue + dark-blue system */
    --accent: #0B63F6;
    /* derived deep navy-blue tones for hero / surfaces follow the accent automatically */
    --brand-1: color-mix(in oklab, var(--accent) 80%, #07112E);
    --brand-2: color-mix(in oklab, var(--accent) 44%, #07112E);
    --brand-3: color-mix(in oklab, var(--accent) 20%, #07112E);
    --accent-soft: color-mix(in oklab, var(--accent) 11%, #ffffff);
    --on-accent: #FFFFFF;
    --radius: 22px;
    --shadow-sm: 0 1px 2px rgba(20,22,35,.05), 0 8px 20px -10px rgba(20,22,35,.16);
    --shadow-lg: 0 24px 60px -24px rgba(20,22,35,.30);
  }
  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Geist", -apple-system, "SF Pro Display", system-ui, sans-serif;
    background: #E7E8EE;
    color: var(--ink);
    overflow: hidden;
    letter-spacing: -0.005em;
  }
  #root { height: 100%; }
  button { font-family: inherit; }

  /* fullscreen Telegram Mini App shell (no device bezel) */
  .stage { height: 100%; width: 100%; display: flex; align-items: stretch; justify-content: center; }
  .app-shell {
    width: 100%; max-width: 440px; height: 100%; flex-shrink: 0;
    background: var(--bg); overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    box-shadow: 0 0 0 1px rgba(20,22,35,.06), 0 30px 80px -30px rgba(20,22,35,.30);
  }
  .device-root { display: flex; flex-direction: column; height: 100%; width: 100%; }
  .scroll-area { -webkit-overflow-scrolling: touch; }
  .screen-pad { padding: 10px 20px 28px; }

  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }

  .card { transition: box-shadow .25s ease, transform .15s ease; }
  .btn-press { transition: transform .12s ease, opacity .2s ease; }
  .btn-press:active { transform: scale(.96); opacity: .9; }

  input::placeholder { color: var(--ink-3); font-weight: 500; letter-spacing: 0.04em; }
  h1, h2, h3, p { margin: 0; }

  /* animations */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes popIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes ringPulse { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.7); opacity: 0; } }
  @keyframes shakeX { 10%,90% { transform: translateX(-1px); } 20%,80% { transform: translateX(2px); } 30%,50%,70% { transform: translateX(-5px); } 40%,60% { transform: translateX(5px); } }
  @keyframes checkDraw { from { stroke-dashoffset: 32; } to { stroke-dashoffset: 0; } }

  /* Entrance uses a TRANSFORM-ONLY slide: if the compositor is frozen (capture /
     print / PDF) content is at most slightly offset but never hidden. Real
     browsers play a smooth slide. Opacity is never animated for this reason. */
  .shake { animation: shakeX .42s cubic-bezier(.36,.07,.19,.97) both; }
  .ring-pulse { display: none; }
  .check-draw { stroke-dasharray: 32; stroke-dashoffset: 0; }

  @keyframes slideUp { from { transform: translateY(16px); } to { transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .reveal-ctx .anim { animation: slideUp .55s cubic-bezier(.22,1,.36,1) both; }
    .ring-pulse { display: block; animation: ringPulse 1.6s ease-out infinite; }
  }

</style>
</head>

<script type="text/babel" data-presets="react">
// i18n.jsx — bilingual (uz default, ru) context + helpers
const LangCtx = React.createContext("uz");

// useT() -> t("Uzbek", "Russian") returns the active-language string
function useT() {
  const lang = React.useContext(LangCtx);
  return (uz, ru) => (lang === "ru" ? ru : uz);
}
// current lang value
function useLang() {
  return React.useContext(LangCtx);
}
// pick a bilingual field {uz, ru} from data
function pick(obj, lang) {
  if (obj && typeof obj === "object" && ("uz" in obj || "ru" in obj)) {
    return lang === "ru" ? obj.ru : obj.uz;
  }
  return obj;
}

Object.assign(window, { LangCtx, useT, useLang, pick });

</script>

<script type="text/babel" data-presets="react">
// ui.jsx — Emerich design-system primitives
const { useState, useEffect, useRef } = React;

// ── helpers ───────────────────────────────────────────────
const NBSP = "\u202F"; // narrow no-break space for RU thousands
function fmt(n) {
  const neg = n < 0;
  const s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return (neg ? "−" : "") + s;
}
function plural(n, one, few, many) {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
}
const ptsWord = (n, lang) => lang === "ru" ? plural(n, "балл", "балла", "баллов") : "ball";

// count-up animation
function useCountUp(target, ms = 900, deps = []) {
  const [v, setV] = useState(target);
  const prev = useRef(target);
  useEffect(() => {
    const from = prev.current, to = target, t0 = performance.now();
    let raf;
    const tick = (t) => {
      const p = Math.min(1, (t - t0) / ms);
      const e = 1 - Math.pow(1 - p, 3);
      setV(Math.round(from + (to - from) * e));
      if (p < 1) raf = requestAnimationFrame(tick);
      else prev.current = to;
    };
    raf = requestAnimationFrame(tick);
    // Fallback: guarantee the final value even if rAF is throttled/frozen.
    const done = setTimeout(() => { setV(to); prev.current = to; }, ms + 80);
    return () => { cancelAnimationFrame(raf); clearTimeout(done); };
  }, deps.length ? deps : [target]);
  return v;
}

// reveal a value after mount (for progress bar fill)
function useReveal(value, delay = 120) {
  const [v, setV] = useState(0);
  useEffect(() => { const t = setTimeout(() => setV(value), delay); return () => clearTimeout(t); }, [value]);
  return v;
}

// ── building blocks ───────────────────────────────────────
function Card({ children, style, onClick, pad = 18, className = "", ...rest }) {
  return (
    <div className={"card " + className} onClick={onClick}
      style={{ background: "var(--surface-2)", borderRadius: "var(--radius)",
        boxShadow: "var(--shadow-sm)", padding: pad,
        cursor: onClick ? "pointer" : "default", ...style }} {...rest}>
      {children}
    </div>
  );
}

function Button({ children, variant = "primary", full, icon, onClick, disabled, size = "md", style }) {
  const sizes = { sm: { h: 38, fs: 14, px: 16 }, md: { h: 50, fs: 16, px: 22 }, lg: { h: 56, fs: 17, px: 24 } };
  const s = sizes[size];
  const base = {
    height: s.h, fontSize: s.fs, padding: `0 ${s.px}px`, border: "none",
    borderRadius: variant === "ghost" ? 12 : Math.min(18, s.h / 2.4),
    fontWeight: 600, letterSpacing: "-0.01em", display: "inline-flex",
    alignItems: "center", justifyContent: "center", gap: 8, width: full ? "100%" : "auto",
    cursor: disabled ? "not-allowed" : "pointer", fontFamily: "inherit",
    transition: "transform .12s ease, opacity .2s ease, background .2s ease",
    opacity: disabled ? 0.4 : 1, WebkitTapHighlightColor: "transparent", ...style,
  };
  const variants = {
    primary:   { background: "var(--accent)", color: "var(--on-accent)" },
    secondary: { background: "var(--surface)", color: "var(--ink)", boxShadow: "inset 0 0 0 1px var(--line)" },
    ghost:     { background: "transparent", color: "var(--ink-2)" },
    dark:      { background: "#fff", color: "#111" },
  };
  return (
    <button className="btn-press" onClick={disabled ? undefined : onClick} disabled={disabled}
      style={{ ...base, ...variants[variant] }}>
      {icon && <Icon name={icon} size={18} stroke={2} />}
      {children}
    </button>
  );
}

function ProgressBar({ value, max, height = 8, light = false }) {
  const pct = Math.max(0, Math.min(100, (value / max) * 100));
  return (
    <div style={{ height, borderRadius: height, width: "100%",
      background: light ? "rgba(255,255,255,.16)" : "var(--track)", overflow: "hidden" }}>
      <div style={{ height: "100%", width: pct + "%", borderRadius: height,
        background: light ? "#fff" : "var(--accent)",
        transition: "width 1.1s cubic-bezier(.22,1,.36,1)" }} />
    </div>
  );
}

function Avatar({ size = 44, initials = USER.initials, ring }) {
  return (
    <div style={{ width: size, height: size, borderRadius: "50%", flexShrink: 0,
      background: "var(--accent)", color: "#fff", display: "flex", alignItems: "center",
      justifyContent: "center", fontWeight: 600, fontSize: size * 0.36, letterSpacing: "0.02em",
      boxShadow: ring ? "0 0 0 3px var(--surface-2), 0 0 0 4px var(--line)" : "none" }}>
      {initials}
    </div>
  );
}

// reward thumbnail — soft panel with category icon (placeholder for product photo)
function RewardThumb({ icon, size, locked, image }) {
  return (
    <div style={{ width: size || "100%", aspectRatio: size ? undefined : "1 / 1",
      height: size, borderRadius: 16, background: "var(--surface)",
      display: "flex", alignItems: "center", justifyContent: "center",
      position: "relative", overflow: "hidden" }}>
      {image
        ? <img src={image} alt="" onError={(e) => { e.target.style.display = "none"; }}
            style={{ width: "100%", height: "100%", objectFit: "cover", display: "block", opacity: locked ? 0.55 : 1 }} />
        : <Icon name={icon} size={size ? size * 0.5 : 56} stroke={1.5}
            color={locked ? "var(--ink-3)" : "var(--ink)"} style={{ opacity: locked ? 0.5 : 0.9 }} />}
    </div>
  );
}

function StatusBadge({ status }) {
  const lang = useLang();
  const meta = STATUS[status] || { label: { uz: status, ru: status } };
  const muted = { bg: "transparent", fg: "var(--ink-3)", line: "var(--line)", dot: "var(--ink-3)" };
  const styleByStatus = {
    delivered: { bg: "var(--accent)", fg: "#fff", line: "transparent", dot: "#fff" },
    shipping:  { bg: "transparent", fg: "var(--ink)", line: "var(--ink)", dot: "var(--ink)" },
    approved:  { bg: "var(--surface)", fg: "var(--ink)", line: "transparent", dot: "var(--ink-2)" },
    pending:   { bg: "transparent", fg: "var(--ink-2)", line: "var(--line)", dot: "var(--ink-3)" },
    cancelled: muted, rejected: muted, not_received: muted,
  }[status] || muted;
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, height: 26, whiteSpace: "nowrap",
      padding: "0 11px", borderRadius: 13, fontSize: 12.5, fontWeight: 600, letterSpacing: "-0.01em", flexShrink: 0,
      background: styleByStatus.bg, color: styleByStatus.fg,
      boxShadow: styleByStatus.line !== "transparent" ? `inset 0 0 0 1px ${styleByStatus.line}` : "none" }}>
      {status === "delivered"
        ? <Icon name="check" size={13} stroke={2.6} />
        : <span style={{ width: 6, height: 6, borderRadius: "50%", background: styleByStatus.dot }} />}
      {pick(meta.label, lang)}
    </span>
  );
}

function SectionHeader({ title, action, onAction }) {
  return (
    <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 12 }}>
      <h2 style={{ fontSize: 19, fontWeight: 650, letterSpacing: "-0.02em", margin: 0 }}>{title}</h2>
      {action && (
        <button onClick={onAction} className="btn-press" style={{ border: "none", background: "none",
          color: "var(--ink-2)", fontSize: 14, fontWeight: 550, fontFamily: "inherit", cursor: "pointer",
          display: "inline-flex", alignItems: "center", gap: 2 }}>
          {action}<Icon name="chevronR" size={15} stroke={2} />
        </button>
      )}
    </div>
  );
}

function EmptyState({ icon, title, text, cta, onCta }) {
  return (
    <div className="anim" style={{ display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center",
      padding: "54px 28px", "--anim": "fadeUp .5s ease both" }}>
      <div style={{ width: 76, height: 76, borderRadius: 22, background: "var(--surface)",
        display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 20 }}>
        <Icon name={icon} size={34} stroke={1.5} color="var(--ink-3)" />
      </div>
      <div style={{ fontSize: 18, fontWeight: 640, letterSpacing: "-0.02em", marginBottom: 7 }}>{title}</div>
      <div style={{ fontSize: 14.5, lineHeight: 1.5, color: "var(--ink-2)", maxWidth: 250 }}>{text}</div>
      {cta && <div style={{ marginTop: 22 }}><Button size="sm" onClick={onCta}>{cta}</Button></div>}
    </div>
  );
}

Object.assign(window, {
  fmt, plural, ptsWord, useCountUp, useReveal,
  Card, Button, ProgressBar, Avatar, RewardThumb, StatusBadge, SectionHeader, EmptyState,
});

</script>

<script type="text/babel" data-presets="react">
// screen-rewards.jsx
const { useState: useStateR, useEffect: useEffectR } = React;

function rewardState(r, points) {
  if (r.stock <= 0) return "out";
  if (points >= r.cost) return "available";
  return "locked";
}

function CostTag({ cost }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 5 }}>
      <Icon name="star" size={15} fill color="var(--accent)" stroke={0} />
      <span style={{ fontSize: 15, fontWeight: 700, letterSpacing: "-0.02em", fontVariantNumeric: "tabular-nums" }}>{fmt(cost)}</span>
    </div>
  );
}

function RewardCard({ r, points, onOpen }) {
  const t = useT();
  const lang = useLang();
  const st = rewardState(r, points);
  const remaining = Math.max(0, r.cost - points);
  return (
    <button onClick={() => onOpen(r)} className="btn-press"
      style={{ background: "var(--surface-2)", borderRadius: "var(--radius)", padding: 12, border: "none",
        cursor: "pointer", textAlign: "left", fontFamily: "inherit", color: "inherit",
        boxShadow: "var(--shadow-sm)", display: "flex", flexDirection: "column" }}>
      <div style={{ position: "relative" }}>
        <RewardThumb icon={r.icon} image={r.image} locked={st !== "available"} />
        {st === "available" && (
          <span style={{ position: "absolute", top: 8, left: 8, fontSize: 11, fontWeight: 700,
            color: "#fff", background: "var(--accent)", padding: "4px 9px", borderRadius: 9, letterSpacing: "0.02em" }}>
            {t("Mavjud", "Доступно")}
          </span>
        )}
        {st === "out" && (
          <span style={{ position: "absolute", top: 8, left: 8, fontSize: 11, fontWeight: 700,
            color: "var(--ink-2)", background: "rgba(255,255,255,.9)", padding: "4px 9px", borderRadius: 9 }}>
            {t("Tugadi", "Нет в наличии")}
          </span>
        )}
        {st === "locked" && (
          <span style={{ position: "absolute", top: 8, right: 8, width: 26, height: 26, borderRadius: 9,
            background: "rgba(255,255,255,.85)", backdropFilter: "blur(6px)", display: "flex",
            alignItems: "center", justifyContent: "center" }}>
            <Icon name="lock" size={13} stroke={1.9} color="var(--ink-2)" />
          </span>
        )}
      </div>
      <div style={{ padding: "12px 4px 2px", flex: 1, display: "flex", flexDirection: "column" }}>
        <div style={{ fontSize: 14.5, fontWeight: 640, letterSpacing: "-0.02em", lineHeight: 1.25 }}>{pick(r.title, lang)}</div>
        <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 2 }}>{pick(r.sub, lang)}</div>
        <div style={{ marginTop: 10 }}><CostTag cost={r.cost} /></div>
        <div style={{ marginTop: "auto", paddingTop: 11 }}>
          {st === "available" && (
            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--accent)", display: "flex", alignItems: "center", gap: 4 }}>
              {t("Almashtirish", "Обменять")} <Icon name="chevronR" size={13} stroke={2.2} />
            </div>
          )}
          {st === "locked" && (
            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--ink-3)" }}>
              +{fmt(remaining)} {t("ball kerak", "баллов нужно")}
            </div>
          )}
          {st === "out" && (
            <div style={{ fontSize: 12, fontWeight: 600, color: "var(--ink-3)" }}>
              {t("Zaxira tugadi", "Закончился")}
            </div>
          )}
        </div>
      </div>
    </button>
  );
}

function RewardSheet({ r, points, onClose, onRedeem }) {
  const t = useT();
  const lang = useLang();
  const [shown, setShown] = useStateR(false);
  useEffectR(() => { const id = requestAnimationFrame(() => setShown(true)); return () => cancelAnimationFrame(id); }, []);
  useEffectR(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);
  const st = rewardState(r, points);
  const enough = points >= r.cost;
  const remainingAfter = points - r.cost;
  const close = () => { setShown(false); setTimeout(onClose, 240); };

  const row = (label, value, strong, color) => (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "11px 0" }}>
      <span style={{ fontSize: 14, color: "var(--ink-2)" }}>{label}</span>
      <span style={{ fontSize: 15, fontWeight: strong ? 720 : 600, letterSpacing: "-0.02em",
        fontVariantNumeric: "tabular-nums", color: color || "var(--ink)" }}>{value}</span>
    </div>
  );

  return (
    <div onClick={close} style={{ position: "absolute", inset: 0, zIndex: 55, display: "flex", flexDirection: "column",
      justifyContent: "flex-end", background: "rgba(20,22,35,.42)", opacity: shown ? 1 : 0, transition: "opacity .24s ease" }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "var(--bg)", borderRadius: "26px 26px 0 0",
        padding: "10px 20px calc(env(safe-area-inset-bottom, 0px) + 22px)", transform: shown ? "translateY(0)" : "translateY(100%)",
        transition: "transform .32s cubic-bezier(.22,1,.36,1)", boxShadow: "0 -20px 50px -20px rgba(20,22,35,.4)" }}>
        <div style={{ width: 40, height: 5, borderRadius: 3, background: "var(--line)", margin: "0 auto 16px" }} />
        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <div style={{ width: 92, flexShrink: 0 }}><RewardThumb icon={r.icon} image={r.image} /></div>
          <div style={{ minWidth: 0 }}>
            <div style={{ fontSize: 18, fontWeight: 700, letterSpacing: "-0.02em", lineHeight: 1.2 }}>{pick(r.title, lang)}</div>
            <div style={{ fontSize: 13, color: "var(--ink-3)", marginTop: 3 }}>{pick(r.sub, lang)}</div>
            <div style={{ marginTop: 9 }}><CostTag cost={r.cost} /></div>
          </div>
        </div>
        <div style={{ fontSize: 14, lineHeight: 1.5, color: "var(--ink-2)", marginTop: 16 }}>{pick(r.desc, lang)}</div>

        <div style={{ background: "var(--surface)", borderRadius: 16, padding: "4px 16px", marginTop: 18 }}>
          {row(t("Balansingiz", "Ваш баланс"), fmt(points))}
          <div style={{ height: 1, background: "var(--line)" }} />
          {row(t("Sovg'a narxi", "Стоимость награды"), "−" + fmt(r.cost))}
          <div style={{ height: 1, background: "var(--line)" }} />
          {row(t("Qoladigan ball", "Останется баллов"), enough ? fmt(remainingAfter) : t("yetarli emas", "недостаточно"),
            true, enough ? "var(--accent)" : "var(--ink-3)")}
        </div>

        <div style={{ marginTop: 18 }}>
          <Button full size="lg" disabled={!enough || st === "out"}
            onClick={() => { if (enough && st !== "out") { onRedeem(r); close(); } }}>
            {st === "out" ? t("Zaxira tugadi", "Нет в наличии")
              : enough ? t("Almashtirish", "Обменять")
              : t("Ball yetarli emas", "Недостаточно баллов")}
          </Button>
        </div>
      </div>
    </div>
  );
}

function RewardsScreen({ points, onRedeem, empty, layout = "grid" }) {
  const t = useT();
  const lang = useLang();
  const [filter, setFilter] = useStateR("all");
  const [sheet, setSheet] = useStateR(null);

  const FILTERS = [
    { id: "all", label: t("Hammasi", "Все") },
    { id: "available", label: t("Mavjud", "Доступные") },
  ];
  const list = empty ? [] : REWARDS.filter((r) => filter === "all" || rewardState(r, points) === "available");
  const available = REWARDS.filter((r) => rewardState(r, points) === "available").length;

  return (
    <div className="screen-pad">
      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", paddingTop: 4 }}>
        <div>
          <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.035em", margin: 0 }}>{t("Sovg'alar", "Награды")}</h1>
          <div style={{ fontSize: 14, color: "var(--ink-2)", marginTop: 3 }}>
            {available} {t("ta sovg'a mavjud", lang === "ru" ? "наград доступно" : "")}
          </div>
        </div>
        <span style={{ display: "inline-flex", alignItems: "center", gap: 6, height: 36, padding: "0 13px",
          background: "var(--accent)", color: "#fff", borderRadius: 18, fontSize: 14, fontWeight: 650,
          fontVariantNumeric: "tabular-nums" }}>
          <Icon name="star" size={14} fill color="#fff" stroke={0} />{fmt(points)}
        </span>
      </div>

      <div className="no-scrollbar" style={{ display: "flex", gap: 8, overflowX: "auto", margin: "18px -20px 0",
        padding: "0 20px" }}>
        {FILTERS.map((f) => (
          <button key={f.id} onClick={() => setFilter(f.id)} className="btn-press"
            style={{ flexShrink: 0, height: 36, padding: "0 16px", borderRadius: 18, border: "none",
              fontFamily: "inherit", fontSize: 14, fontWeight: 600, cursor: "pointer", transition: "all .2s ease",
              background: filter === f.id ? "var(--accent)" : "var(--surface-2)",
              color: filter === f.id ? "#fff" : "var(--ink-2)",
              boxShadow: filter === f.id ? "none" : "inset 0 0 0 1px var(--line)" }}>
            {f.label}
          </button>
        ))}
      </div>

      {list.length === 0 ? (
        <Card pad={4} style={{ marginTop: 16 }}>
          <EmptyState icon="gift" title={t("Sovg'alar tez orada", "Награды скоро появятся")}
            text={t("Yangi sovg'alar katalogi tayyorlanmoqda. Birozdan keyin qarang.",
              "Мы готовим новый каталог наград. Загляните чуть позже.")} />
        </Card>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginTop: 18 }}>
          {list.map((r) => <RewardCard key={r.id} r={r} points={points} onOpen={setSheet} />)}
        </div>
      )}

      {sheet && <RewardSheet r={sheet} points={points} onClose={() => setSheet(null)} onRedeem={onRedeem} />}
    </div>
  );
}

window.RewardsScreen = RewardsScreen;
window.rewardState = rewardState;

</script>

      flexDirection: "column", animation: "overlayIn .25s ease both" }}>

        padding: "calc(env(safe-area-inset-top, 8px) + 10px) 16px 10px" }}>
        <span style={{ color: "rgba(255,255,255,.7)", fontSize: 13.5, fontWeight: 550 }}>{pick(photo.date, lang)}</span>
        <button onClick={onClose} className="btn-press" aria-label="close"
          style={{ width: 36, height: 36, borderRadius: "50%", border: "none", background: "rgba(255,255,255,.14)",

          <Icon name="x" size={18} stroke={2.2} color="#fff" />
        </button>
      </div>
      <div style={{ flex: 1, display: "flex", alignItems: "center", justifyContent: "center", padding: "0 16px", minHeight: 0 }}>
        <img src={photo.src} alt="" style={{ maxWidth: "100%", maxHeight: "100%", borderRadius: 16, objectFit: "contain" }} />
      </div>
      <div style={{ padding: "16px 16px calc(env(safe-area-inset-bottom, 0px) + 18px)" }}>
        {editing ? (
          <div style={{ display: "flex", gap: 8 }}>
            <input value={text} onChange={(e) => setText(e.target.value)} maxLength={80} autoFocus
              placeholder={t("Izoh qo'shing", "Добавьте комментарий")}
              style={{ flex: 1, border: "none", outline: "none", background: "rgba(255,255,255,.12)", color: "#fff",
                borderRadius: 12, padding: "0 14px", height: 44, fontFamily: "inherit", fontSize: 15 }} />
            <button onClick={() => { onCaption(photo.id, text); setEditing(false); }} className="btn-press"
              style={{ border: "none", background: "var(--accent)", color: "#fff", borderRadius: 12, padding: "0 16px",
                height: 44, fontFamily: "inherit", fontSize: 14, fontWeight: 650, cursor: "pointer" }}>{t("Saqlash", "Сохранить")}</button>
          </div>
        ) : (
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <button onClick={() => setEditing(true)} className="btn-press"
              style={{ flex: 1, textAlign: "left", border: "none", background: "rgba(255,255,255,.1)", color: photo.caption ? "#fff" : "rgba(255,255,255,.55)",
                borderRadius: 12, padding: "12px 14px", fontFamily: "inherit", fontSize: 14.5, cursor: "pointer", display: "flex",
                alignItems: "center", gap: 8 }}>
              <Icon name="doc" size={16} stroke={1.8} color="rgba(255,255,255,.6)" />
              {photo.caption || t("Izoh qo'shish", "Добавить комментарий")}
            </button>
            <button onClick={() => onRemove(photo.id)} className="btn-press" aria-label="delete"
              style={{ width: 44, height: 44, borderRadius: 12, border: "none", background: "rgba(192,57,43,.9)",
                cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Icon name="trash" size={18} stroke={1.9} color="#fff" />
            </button>

function ConfirmDelete({ onCancel, onConfirm }) {
  const t = useT();
  return (
    <div onClick={onCancel} style={{ position: "absolute", inset: 0, zIndex: 68, display: "flex", alignItems: "center",
      justifyContent: "center", padding: 32, background: "rgba(20,22,35,.5)", animation: "overlayIn .2s ease both" }}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "var(--bg)", borderRadius: 22, padding: "24px 22px",
        width: "100%", maxWidth: 320, textAlign: "center", animation: "popIn .3s cubic-bezier(.34,1.56,.64,1) both" }}>
        <div style={{ width: 52, height: 52, borderRadius: 16, background: "rgba(192,57,43,.1)", margin: "0 auto 14px",
          display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="trash" size={24} stroke={1.8} color="#C0392B" />
        </div>
        <div style={{ fontSize: 17, fontWeight: 680, letterSpacing: "-0.02em" }}>{t("Ushbu rasmni o'chirasizmi?", "Удалить это фото?")}</div>
        <div style={{ fontSize: 14, color: "var(--ink-2)", marginTop: 6, lineHeight: 1.4 }}>
          {t("Bu amalni qaytarib bo'lmaydi.", "Это действие нельзя отменить.")}
        </div>
        <div style={{ display: "flex", gap: 10, marginTop: 20 }}>
          <Button variant="secondary" size="md" style={{ flex: 1 }} onClick={onCancel}>{t("Bekor", "Отмена")}</Button>
          <button onClick={onConfirm} className="btn-press"
            style={{ flex: 1, height: 50, border: "none", borderRadius: 16, background: "#C0392B", color: "#fff",
              fontSize: 16, fontWeight: 600, fontFamily: "inherit", cursor: "pointer" }}>{t("O'chirish", "Удалить")}</button>
        </div>
      </div>
    </div>
  );
}

function ProjectsScreen({ projects, onAdd, onRemove, onCaption, full, uploadedToday, maxPerDay }) {
  const t = useT();
  const lang = useLang();
  const inputRef = useRefPr(null);
  const [pending, setPending] = useStatePr(null);   // { file, url }
  const [viewer, setViewer] = useStatePr(null);      // photo
  const [confirmId, setConfirmId] = useStatePr(null);
  const [toast, setToast] = useStatePr(null);
  const cap = maxPerDay || MAX_PHOTOS;
  const todayN = uploadedToday || 0;

  const flash = (msg, kind) => { setToast({ msg, kind }); setTimeout(() => setToast(null), 2600); };

  const onFile = (e) => {
    const file = (e.target.files || [])[0];
    e.target.value = "";
    if (!file) return;
    if (!file.type.startsWith("image/")) { flash(t("Faqat rasm yuklash mumkin", "Можно загружать только изображения"), "error"); return; }
    if (file.size > MAX_MB * 1024 * 1024) { flash(t(`Rasm ${MAX_MB}MB dan katta`, `Фото больше ${MAX_MB}МБ`), "error"); return; }
    setPending({ file, url: URL.createObjectURL(file) });
  };

  const doUpload = (caption) => {
    onAdd(pending.file, caption);
    setPending(null);
    flash(t("Rasm yuklandi", "Фото загружено"), "ok");
  };

  return (
    <div className="screen-pad" style={{ paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 28px)" }}>
      <div style={{ paddingTop: 4 }}>
        <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.035em", margin: 0 }}>{t("Loyihalarim", "Мои проекты")}</h1>
        <div style={{ fontSize: 14, color: "var(--ink-2)", marginTop: 3 }}>{t("Ishlaringiz suratlarini yuklang", "Загрузите фото своих работ")}</div>
      </div>

      <input ref={inputRef} type="file" accept="image/*" capture="environment" onChange={onFile} style={{ display: "none" }} />

      {/* block 1: upload */}
      <div className="anim" style={{ marginTop: 18, "--anim": "fadeUp .5s ease both" }}>
        <button onClick={() => !full && inputRef.current && inputRef.current.click()} className="btn-press" disabled={full}
          style={{ width: "100%", border: "2px dashed " + (full ? "var(--line)" : "color-mix(in oklab, var(--accent) 45%, var(--line))"),
            background: full ? "var(--surface)" : "var(--accent-soft)", borderRadius: "var(--radius)", padding: "26px 20px",
            cursor: full ? "not-allowed" : "pointer", fontFamily: "inherit", display: "flex", flexDirection: "column",
            alignItems: "center", gap: 10, opacity: full ? 0.7 : 1 }}>
          <div style={{ width: 54, height: 54, borderRadius: 16, background: full ? "var(--ink-3)" : "var(--accent)",
            display: "flex", alignItems: "center", justifyContent: "center" }}>
            <Icon name="camera" size={26} stroke={1.8} color="#fff" />
          </div>
          <div style={{ fontSize: 15.5, fontWeight: 650, letterSpacing: "-0.01em", color: "var(--ink)" }}>
            {full ? t("Bugungi limit tugadi", "Лимит на сегодня исчерпан") : t("Loyihani suratga oling", "Сфотографируйте работу")}
          </div>
          <div style={{ fontSize: 13, color: "var(--ink-2)" }}>
            {full ? t("Ertaga davom eting", "Продолжите завтра") : t("Kamera yoki galereyadan", "С камеры или галереи")} · {todayN}/{cap}
          </div>
        </button>
      </div>

      {/* block 2: gallery */}
      <div style={{ fontSize: 12.5, fontWeight: 650, color: "var(--ink-3)", textTransform: "uppercase",
        letterSpacing: "0.06em", margin: "24px 0 11px", paddingLeft: 4 }}>{t("Yuklangan suratlar", "Загруженные фото")}</div>

      {projects.length === 0 ? (
        <Card pad={4}>
          <EmptyState icon="image" title={t("Hali surat yo'q", "Фото пока нет")}
            text={t("Birinchi ishingiz suratini yuklang \u2014 bu sizning haqiqiy usta ekaningizni tasdiqlaydi.",
              "Загрузите фото первой работы \u2014 это подтвердит, что вы настоящий мастер.")} />
        </Card>
      ) : (
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {projects.map((p, i) => (
            <div key={p.id} className="anim" style={{ position: "relative", aspectRatio: "1 / 1", borderRadius: 16,
              overflow: "hidden", background: "var(--surface)", boxShadow: "var(--shadow-sm)", cursor: p.uploading ? "default" : "pointer",
              "--anim": `cardIn .4s ease ${i * 0.03}s both` }}
              onClick={() => !p.uploading && setViewer(p)}>
              <img src={p.src} alt="" style={{ width: "100%", height: "100%", objectFit: "cover", display: "block",
                filter: p.uploading ? "brightness(.6)" : "none" }} />
              {/* uploading progress */}
              {p.uploading && (
                <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center",
                  justifyContent: "center", gap: 9, color: "#fff" }}>
                  <span style={{ fontSize: 18, fontWeight: 750, fontVariantNumeric: "tabular-nums" }}>{p.progress}%</span>
                  <div style={{ width: "62%", height: 4, borderRadius: 4, background: "rgba(255,255,255,.3)", overflow: "hidden" }}>
                    <div style={{ height: "100%", width: p.progress + "%", background: "#fff", borderRadius: 4, transition: "width .2s linear" }} />
                  </div>
                </div>
              )}
              {/* date chip */}
              {!p.uploading && (
                <div style={{ position: "absolute", left: 0, right: 0, bottom: 0, padding: "18px 10px 8px",
                  background: "linear-gradient(transparent, rgba(8,12,28,.7))", display: "flex", alignItems: "center", gap: 5 }}>
                  {p.caption
                    ? <span style={{ color: "#fff", fontSize: 12, fontWeight: 550, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{p.caption}</span>
                    : <span style={{ color: "rgba(255,255,255,.85)", fontSize: 12, fontWeight: 550 }}>{pick(p.date, lang)}</span>}
                </div>
              )}
              {/* delete */}
              {!p.uploading && (
                <button onClick={(e) => { e.stopPropagation(); setConfirmId(p.id); }} className="btn-press" aria-label="remove"
                  style={{ position: "absolute", top: 6, right: 6, width: 26, height: 26, borderRadius: "50%", border: "none",
                    background: "rgba(8,12,28,.55)", backdropFilter: "blur(4px)", cursor: "pointer", display: "flex",
                    alignItems: "center", justifyContent: "center" }}>
                  <Icon name="x" size={14} stroke={2.4} color="#fff" />
                </button>
              )}
            </div>
          ))}
        </div>
      )}

      {pending && <ComposeSheet pending={pending} onCancel={() => setPending(null)} onUpload={doUpload} />}
      {viewer && <PhotoViewer photo={projects.find((x) => x.id === viewer.id) || viewer} onClose={() => setViewer(null)}
        onRemove={(id) => { setViewer(null); setConfirmId(id); }} onCaption={onCaption} />}
      {confirmId && <ConfirmDelete onCancel={() => setConfirmId(null)}
        onConfirm={() => { onRemove(confirmId); setConfirmId(null); }} />}
      {toast && <Toast msg={toast.msg} kind={toast.kind} />}
    </div>
  );
}

window.ProjectsScreen = ProjectsScreen;

</script>
<script type="text/babel" data-presets="react">

function LangRow({ lang, setLang }) {

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 13, padding: "11px 14px", borderBottom: "1px solid var(--line)" }}>
      <div style={{ width: 34, height: 34, borderRadius: 10, background: "var(--surface)", flexShrink: 0,
        display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Icon name="globe" size={18} stroke={1.7} />

      <span style={{ flex: 1, fontSize: 15.5, fontWeight: 550, letterSpacing: "-0.01em" }}>{t("Til", "Язык")}</span>
      <div style={{ display: "flex", background: "var(--surface)", borderRadius: 11, padding: 3, gap: 2 }}>
        {[["uz", "O'zbek"], ["ru", "Русский"]].map(([l, name]) => (
          <button key={l} onClick={() => setLang(l)} className="btn-press"
            style={{ border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 13, fontWeight: 600,
              padding: "6px 12px", borderRadius: 8, background: lang === l ? "var(--surface-2)" : "transparent",
              color: lang === l ? "var(--ink)" : "var(--ink-3)",
              boxShadow: lang === l ? "0 1px 2px rgba(20,22,35,.12)" : "none", transition: "all .2s ease" }}>
            {name}
          </button>

}

function ProfileScreen({ points, scans, gifts, lang, setLang, onNav }) {
  const t = useT();
  return (
    <div className="screen-pad">
      <h1 style={{ fontSize: 28, fontWeight: 700, letterSpacing: "-0.035em", margin: "4px 0 0" }}>{t("Profil", "Профиль")}</h1>

      <Card className="anim" style={{ marginTop: 18, display: "flex", alignItems: "center", gap: 16,
        "--anim": "fadeUp .5s ease both" }}>
        <Avatar size={64} />
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ fontSize: 19, fontWeight: 680, letterSpacing: "-0.02em" }}>{USER.fullName}</div>
          <div style={{ fontSize: 14, color: "var(--ink-2)", marginTop: 2 }}>{USER.username}</div>
        </div>
      </Card>

      <div className="anim" style={{ display: "flex", gap: 12, marginTop: 14, "--anim": "fadeUp .5s ease .05s both" }}>
        <StatTile value={fmt(points)} label={t("Balans", "Баланс")} icon="star" />
        <StatTile value={fmt(scans)} label={t("Skanlar", "Сканов")} icon="scan" />
        <StatTile value={fmt(gifts)} label={t("Sovg'alar", "Награды")} icon="gift" />
      </div>

      <div style={{ fontSize: 12.5, fontWeight: 650, color: "var(--ink-3)", textTransform: "uppercase",
        letterSpacing: "0.06em", margin: "24px 0 9px", paddingLeft: 4 }}>{t("Ma'lumot", "Информация")}</div>
      <Card pad={0} className="anim" style={{ "--anim": "fadeUp .5s ease .1s both" }}>
        <InfoRow icon="user" label="Telegram ID" value={fmt(USER.tgId)} />
        <InfoRow icon="phone" label={t("Telefon", "Телефон")} value={USER.phone} last />
      </Card>

      <div style={{ fontSize: 12.5, fontWeight: 650, color: "var(--ink-3)", textTransform: "uppercase",
        letterSpacing: "0.06em", margin: "24px 0 9px", paddingLeft: 4 }}>{t("Sozlamalar", "Настройки")}</div>
      <Card pad={0} className="anim" style={{ "--anim": "fadeUp .5s ease .15s both" }}>
        <InfoRow icon="activity" label={t("Ball harakatlari tarixi", "История баллов")} onClick={() => onNav("activity")} />
        <LangRow lang={lang} setLang={setLang} />
        <InfoRow icon="doc" label={t("Maxfiylik siyosati", "Политика конфиденциальности")} onClick={() => { const u = location.origin + "/api/webapp/privacy-policy/"; try { (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openLink) ? window.Telegram.WebApp.openLink(u) : window.open(u, "_blank"); } catch (e) {} }} last />
      </Card>

      <div style={{ display: "flex", flexDirection: "column", alignItems: "center", marginTop: 26, gap: 8,
        paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 8px)" }}>
        <img src={(window.__resources && window.__resources.jipLogoNavy) || "assets/jip-logo-navy.png"} alt="JIP GROUP"
          style={{ width: 72, opacity: 0.42 }} />
        <div style={{ fontSize: 12, color: "var(--ink-3)" }}>{t("versiya", "версия")} 1.0.0</div>

}

window.ProfileScreen = ProfileScreen;

</script>
<script type="text/babel" data-presets="react">
// screen-activity.jsx
function ActivityRow({ item, divider }) {
  const lang = useLang();
  const earn = item.pts >= 0;
  const iconName = item.type === "redeem" ? "gift" : "ticket";
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 13, padding: "13px 12px",
      borderBottom: divider ? "1px solid var(--line)" : "none" }}>
      <div style={{ width: 40, height: 40, borderRadius: 12, flexShrink: 0, background: "var(--surface)",
        display: "flex", alignItems: "center", justifyContent: "center" }}>
        <Icon name={iconName} size={19} stroke={1.7} color={earn ? "var(--accent)" : "var(--ink-2)"} />
      </div>
      <div style={{ flex: 1, minWidth: 0 }}>
        <div style={{ fontSize: 14.5, fontWeight: 580, letterSpacing: "-0.01em", whiteSpace: "nowrap",
          overflow: "hidden", textOverflow: "ellipsis" }}>{pick(item.title, lang)}</div>
        <div style={{ fontSize: 12.5, color: "var(--ink-3)", whiteSpace: "nowrap", overflow: "hidden",
          textOverflow: "ellipsis", letterSpacing: item.type === "earn" ? "0.04em" : "0" }}>{pick(item.sub, lang)}</div>
      </div>
      <div style={{ fontSize: 15, fontWeight: 680, letterSpacing: "-0.02em", flexShrink: 0,
        fontVariantNumeric: "tabular-nums", color: earn ? "var(--accent)" : "var(--ink-3)" }}>
        {earn ? "+" : "−"}{fmt(Math.abs(item.pts))}
      </div>
    </div>
  );
}

function ActivityScreen({ empty, onBack }) {
  const t = useT();
  const lang = useLang();
  const groups = empty ? [] : ACTIVITY;
  const earned = ACTIVITY.flatMap((g) => g.items).filter((i) => i.pts > 0).reduce((a, b) => a + b.pts, 0);
  const codes = ACTIVITY.flatMap((g) => g.items).filter((i) => i.type === "earn").length;

  return (
    <div className="screen-pad" style={{ paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 28px)" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, paddingTop: 2 }}>
        <button onClick={onBack} className="btn-press" aria-label="back"
          style={{ width: 38, height: 38, marginLeft: -8, border: "none", background: "none", cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon name="chevronL" size={24} stroke={2} color="var(--ink)" />
        </button>
        <h1 style={{ fontSize: 24, fontWeight: 700, letterSpacing: "-0.03em", margin: 0 }}>{t("Tarix", "История")}</h1>
      </div>
      <div style={{ fontSize: 14, color: "var(--ink-2)", margin: "4px 0 0", paddingLeft: 38 }}>{t("Ball harakatlari", "Движение баллов")}</div>

      {!empty && (
        <Card className="anim" style={{ marginTop: 18, display: "flex", alignItems: "center", justifyContent: "space-between",
          "--anim": "fadeUp .5s ease both" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12, minWidth: 0 }}>
            <div style={{ width: 42, height: 42, borderRadius: 13, background: "var(--accent)", flexShrink: 0,
              display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="ticket" size={20} stroke={1.9} color="#fff" />
            </div>
            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: 14, fontWeight: 600, letterSpacing: "-0.01em", whiteSpace: "nowrap" }}>
                {codes} {t("ta promokod", "промокодов")}
              </div>
              <div style={{ fontSize: 12.5, color: "var(--ink-3)", marginTop: 2, whiteSpace: "nowrap" }}>{t("jami hisoblandi", "всего начислено")}</div>
            </div>
          </div>
          <div style={{ fontSize: 22, fontWeight: 700, letterSpacing: "-0.03em", fontVariantNumeric: "tabular-nums", color: "var(--accent)" }}>
            +{fmt(earned)}
          </div>
        </Card>
      )}

      {groups.length === 0 ? (
        <Card pad={4} style={{ marginTop: 18 }}>
          <EmptyState icon="activity" title={t("Tarix bo'sh", "История пуста")}
            text={t("Hali promokod kiritilmagan. Birinchi kodni faollashtiring.",
              "Промокоды пока не вводились. Активируйте первый код.")} />
        </Card>
      ) : (
        <div style={{ marginTop: 22 }}>
          {groups.map((g, gi) => (
            <div key={gi} className="anim" style={{ marginBottom: 18, "--anim": `fadeUp .5s ease ${0.05 + gi * 0.05}s both` }}>
              <div style={{ fontSize: 12.5, fontWeight: 650, color: "var(--ink-3)", textTransform: "uppercase",
                letterSpacing: "0.06em", marginBottom: 9, paddingLeft: 4 }}>{pick(g.group, lang)}</div>
              <Card pad={6}>
                {g.items.map((it, i) => <ActivityRow key={it.id} item={it} divider={i < g.items.length - 1} />)}
              </Card>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

window.ActivityScreen = ActivityScreen;
window.ActivityRow = ActivityRow;

</script>
<script type="text/babel" data-presets="react">
// screen-success.jsx — success overlay (earn points / redeem reward)
const { useEffect: useEffectS, useState: useStateS } = React;

function SuccessOverlay({ data, points, onClose, onGoOrders }) {
  const t = useT();
  const lang = useLang();
  const { mode, amount, reward, newBalance } = data;
  const isEarn = mode === "earn";
  const [ready, setReady] = useStateS(false);
  useEffectS(() => { const id = setTimeout(() => setReady(true), 30); return () => clearTimeout(id); }, []);
  const shownBalance = useCountUp(newBalance, 1200, [newBalance]);

  useEffectS(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return (
    <div className={"reveal-ctx" + (ready ? " is-ready" : "")} style={{ position: "absolute", inset: 0, zIndex: 60, background: "var(--bg)",
      display: "flex", flexDirection: "column" }}>
      <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center",
        justifyContent: "center", padding: "0 32px", textAlign: "center" }}>

        {/* animated check */}
        <div style={{ position: "relative", width: 116, height: 116, marginBottom: 30 }}>
          <span className="ring-pulse" style={{ position: "absolute", inset: 0, borderRadius: "50%",
            border: "2px solid var(--accent)" }} />
          <span className="ring-pulse" style={{ position: "absolute", inset: 0, borderRadius: "50%",
            border: "2px solid var(--accent)", animationDelay: ".4s" }} />
          <div className="anim" style={{ position: "absolute", inset: 0, borderRadius: "50%", background: "var(--accent)",
            display: "flex", alignItems: "center", justifyContent: "center",
            "--anim": "popIn .5s cubic-bezier(.34,1.56,.64,1) both" }}>
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.6"
              strokeLinecap="round" strokeLinejoin="round">
              <path className="check-draw" d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
          </div>
        </div>

        {isEarn ? (
          <>
            <div className="anim" style={{ fontSize: 56, fontWeight: 750, letterSpacing: "-0.04em", lineHeight: 1,
              fontVariantNumeric: "tabular-nums", "--anim": "popIn .55s cubic-bezier(.34,1.56,.64,1) .12s both" }}>
              +{fmt(amount)}
            </div>
            <div className="anim" style={{ fontSize: 17, fontWeight: 550, color: "var(--ink-2)", marginTop: 8,
              "--anim": "fadeUp .5s ease .25s both" }}>
              {t("ball hisoblandi", "баллов начислено")}
            </div>
          </>
        ) : (
          <>
            <div className="anim" style={{ fontSize: 27, fontWeight: 720, letterSpacing: "-0.03em",
              "--anim": "popIn .55s cubic-bezier(.34,1.56,.64,1) .12s both" }}>
              {t("Sovg'a rasmiylashtirildi!", "Награда оформлена!")}
            </div>
            <div className="anim" style={{ fontSize: 16, fontWeight: 550, color: "var(--ink-2)", marginTop: 8,
              "--anim": "fadeUp .5s ease .25s both" }}>{pick(reward.title, lang)}</div>
          </>
        )}

        {/* new balance */}
        <div className="anim" style={{ width: "100%", marginTop: 32, background: "var(--surface)", borderRadius: 20,
          padding: 18, "--anim": "fadeUp .5s ease .35s both", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <span style={{ fontSize: 14, color: "var(--ink-2)", fontWeight: 500 }}>{t("Yangi balans", "Новый баланс")}</span>
          <span style={{ fontSize: 22, fontWeight: 720, letterSpacing: "-0.02em",
            fontVariantNumeric: "tabular-nums", color: "var(--accent)" }}>{fmt(shownBalance)}</span>
        </div>

        <div className="anim" style={{ fontSize: 14.5, color: "var(--ink-2)", marginTop: 22, lineHeight: 1.5, maxWidth: 290,
          "--anim": "fadeUp .5s ease .45s both" }}>
          {isEarn
            ? t("Ajoyib! Xaridlaringiz uchun ball to'plashda davom eting.",
                "Так держать! Продолжайте копить баллы за покупки.")
            : t("Sovg'alar har kvartalda (3 oyda bir marta) tarqatiladi. Tayyor bo'lganda JIP adminlari siz bilan bog'lanadi. Holatni «Buyurtmalar» bo'limida kuzating.",
                "Подарки выдаются раз в квартал (каждые 3 месяца). Когда подарок будет готов, администраторы JIP свяжутся с вами. Следите за статусом в разделе «Заказы».")}
        </div>
      </div>

      <div className="screen-pad anim" style={{ paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 24px)", "--anim": "fadeUp .5s ease .5s both" }}>
        {isEarn
          ? <Button full size="lg" onClick={onClose}>{t("Ajoyib", "Отлично")}</Button>
          : <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              <Button full size="lg" onClick={onGoOrders}>{t("Buyurtmalarga o'tish", "Перейти к заказам")}</Button>
              <Button full size="md" variant="ghost" onClick={onClose}>{t("Yopish", "Закрыть")}</Button>
            </div>}
      </div>
    </div>
  );
}

window.SuccessOverlay = SuccessOverlay;

</script>
<script type="text/babel" data-presets="react">
// data-layer.jsx — REAL JIP backend data (replaces mock data.jsx)
// Fetches API, reshapes into the same window globals the screens consume.

const TG = window.Telegram && window.Telegram.WebApp;
function getTgId() {
  const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  if (u && u.id) return u.id;
  const p = new URLSearchParams(location.search);
  return p.get('tg_id') || p.get('telegram_id') || null;
}
const TGID = getTgId();

function jinitials(name, fb) {
  if (!name) return fb || 'U';
  const parts = String(name).trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return fb || 'U';
  const a = parts[0][0] || '';
  const b = parts.length > 1 ? (parts[parts.length - 1][0] || '') : '';
  return (a + b).toUpperCase();
}
function mapLangFromBackend(l) { return l === 'ru' ? 'ru' : 'uz'; }
function langToBackend(l) { return l === 'ru' ? 'ru' : 'uz_latin'; }

async function api(path, opts) {
  opts = opts || {};
  const url = path.startsWith('/') ? '/api' + path : '/api/' + path;
  const init = { method: opts.method || 'GET', headers: { 'X-Requested-With': 'XMLHttpRequest' }, cache: 'no-store' };
  if (opts.body) {
    init.headers['Content-Type'] = 'application/json';
    init.body = JSON.stringify(TGID ? Object.assign({ telegram_id: TGID, tg_id: TGID }, opts.body) : opts.body);
  }
  const sep = url.includes('?') ? '&' : '?';
  const final = url + (TGID ? sep + 'tg_id=' + TGID + '&telegram_id=' + TGID : '');
  const r = await fetch(final, init);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || data.detail || ('HTTP ' + r.status));
  return data;
}

// XHR upload with progress (FormData)
function uploadXhr(url, formData, onProgress) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url);
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(Math.min(99, Math.round(e.loaded / e.total * 100))); };
    xhr.onload = () => {
      let d = {}; try { d = JSON.parse(xhr.responseText); } catch (e) {}
      if (xhr.status >= 200 && xhr.status < 300) resolve(d);
      else reject(new Error(d.error || ('HTTP ' + xhr.status)));
    };
    xhr.onerror = () => reject(new Error('network'));
    xhr.send(formData);
  });
}

function asList(x, key) {
  if (Array.isArray(x)) return x;
  if (x && Array.isArray(x[key])) return x[key];
  if (x && Array.isArray(x.results)) return x.results;
  return [];
}

const BANNER_GRADS = [
  'linear-gradient(135deg,#243B7A 0%,#101A3C 100%)',
  'linear-gradient(135deg,#2A2350 0%,#15112E 100%)',
  'linear-gradient(135deg, color-mix(in oklab,var(--accent) 88%,#0b0b1a) 0%, color-mix(in oklab,var(--accent) 42%,#0b0b1a) 100%)',
];
const DEFAULT_BANNERS = [
  { id: 'd1', tag: { uz: 'JIP GROUP', ru: 'JIP GROUP' },
    title: { uz: 'Promokodni faollashtiring', ru: 'Активируйте промокод' },
    sub: { uz: 'Sovgʻa kartasidagi kodni kiriting', ru: 'Введите код с подарочной карты' },
    icon: 'spark', grad: BANNER_GRADS[2] },
];

function relDate(d) {
  // d: Date — return {uz, ru} relative label
  try {
    const now = new Date();
    const sd = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const nd = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.round((nd - sd) / 86400000);
    if (diff === 0) return { uz: 'Bugun', ru: 'Сегодня' };
    if (diff === 1) return { uz: 'Kecha', ru: 'Вчера' };
  } catch (e) {}
  const dd = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();
  return { uz: dd, ru: dd };
}
function parseDate(s) {
  if (!s) return new Date();
  // dd.mm.yyyy
  const m = /^(\d{2})\.(\d{2})\.(\d{4})/.exec(s);
  if (m) return new Date(+m[3], +m[2] - 1, +m[1]);
  const d = new Date(s);
  return isNaN(d) ? new Date() : d;
}

function buildActivity(hist, reds) {
  const items = [];
  asList(hist).forEach((h) => {
    const d = parseDate(h.scanned_at);
    items.push({ d, id: 'q' + h.id, type: 'earn',
      title: { uz: 'Promokod faollashtirildi', ru: 'Промокод активирован' },
      sub: h.code || '', pts: h.points || 0 });
  });
  asList(reds).forEach((r) => {
    const g = r.gift || {};
    const cost = g.points_cost || g.cost || 0;
    items.push({ d: parseDate(r.requested_at), id: 'r' + r.id, type: 'redeem',
      title: { uz: 'Sovgʻa olindi', ru: 'Награда получена' },
      sub: g.name || g.title || '', pts: -Math.abs(cost) });
  });
  items.sort((a, b) => b.d - a.d);
  const groups = [];
  let cur = null, curKey = null;
  items.forEach((it) => {
    const lbl = relDate(it.d);
    const key = lbl.uz;
    if (key !== curKey) { cur = { group: lbl, items: [] }; groups.push(cur); curKey = key; }
    cur.items.push({ id: it.id, type: it.type, title: it.title, sub: it.sub, pts: it.pts });
  });
  return groups;
}

const STATUS_MAP = { pending: 'pending', approved: 'approved', sent: 'shipping', completed: 'delivered', cancelled_by_user: 'cancelled', rejected: 'rejected', not_received: 'not_received' };

async function loadData() {
  const [u, gifts, reds, top, hist, admin, promos, proj] = await Promise.all([
    api('/webapp/user/').catch(() => ({})),
    api('/webapp/gifts/').catch(() => ({})),
    api('/webapp/redemptions/').catch(() => ([])),
    api('/webapp/top-users/?user_type=santenik&limit=10').catch(() => ({})),
    api('/webapp/qr-history/').catch(() => ([])),
    api('/webapp/admin-contact/').catch(() => ({})),
    api('/webapp/promotions/').catch(() => ({})),
    api('/webapp/projects/').catch(() => ({})),
  ]);

  window.__initLang = mapLangFromBackend(u.language);

  const giftsList = asList(gifts, 'gifts');
  const redsList = asList(reds, 'redemptions');
  const topList = asList(top, 'items');
  const me = top.me || topList.find((x) => x.is_me);

  const fullName = ((u.first_name || '') + ' ' + (u.last_name || '')).trim();
  window.USER = {
    tgId: u.telegram_id || TGID || 0,
    name: u.first_name || 'Usta',
    fullName: fullName || u.first_name || 'Usta',
    initials: jinitials(fullName || u.username || 'U'),
    username: u.username ? '@' + u.username : '',
    phone: u.phone_number || '',
    points: u.points || 0,
    scans: u.qr_scan_count || 0,
    giftsCount: redsList.filter((r) => ['cancelled_by_user', 'rejected', 'not_received'].indexOf(r.status) === -1).length,
    rank: me ? me.position : 0,
  };

  window.STATUS = {
    pending: { label: { uz: 'Qabul qilindi', ru: 'Принят' }, step: 1 },
    approved: { label: { uz: 'Tasdiqlandi', ru: 'Подтверждён' }, step: 2 },
    shipping: { label: { uz: 'Berishga tayyor', ru: 'Готов к выдаче' }, step: 3 },
    delivered: { label: { uz: 'Olindi', ru: 'Получен' }, step: 4 },
    cancelled: { label: { uz: 'Bekor qilindi', ru: 'Отменён' }, step: 0, terminal: true },
    rejected: { label: { uz: 'Rad etildi', ru: 'Отклонён' }, step: 0, terminal: true },
    not_received: { label: { uz: 'Olinmadi', ru: 'Не получен' }, step: 0, terminal: true },
  };

  window.REWARDS = giftsList.map((g) => ({
    id: g.id, title: g.name || '', sub: '', cost: g.points_cost || 0,
    stock: (g.stock == null ? 9999 : g.stock), icon: 'gift',
    image: g.image || g.image_url || null, desc: g.description || '',
  }));

  window.ORDERS = redsList.map((r) => {
    const st = STATUS_MAP[r.status];
    if (!st) return null;
    const g = r.gift || {};
    return {
      id: r.id, title: g.name || g.title || 'Sovgʻa', icon: 'gift',
      image: g.image || g.image_url || null, cost: g.points_cost || g.cost || 0,
      date: (function () { const d = parseDate(r.requested_at); return relDate(d); })(),
      status: st, cancelable: st === 'pending', user_confirmed: !!r.user_confirmed,
      history: ['cancelled', 'rejected', 'not_received'].indexOf(st) !== -1,
    };
  }).filter(Boolean);

  window.TOP_USERS = topList.map((x) => ({
    rank: x.position, initials: jinitials(x.name), name: x.name, points: x.points || 0, isMe: !!x.is_me,
  }));

  window.ACTIVITY = buildActivity(hist, redsList);

  const acList = asList(admin, 'contacts');
  const findC = (type) => acList.find((c) => c.contact_type === type)
    || (admin.contact_type === type ? { contact_value: admin.contact_value, contact_url: admin.contact_url } : null);
  const tgC = findC('telegram');
  const phC = findC('phone');
  const tgVal = tgC ? String(tgC.contact_value || '') : '';
  const acVal = tgVal || admin.contact_value || (acList[0] || {}).contact_value || '@jip_support';
  window.ADMIN = {
    name: 'JIP GROUP',
    handle: String(acVal).startsWith('@') ? acVal : ('@' + String(acVal).replace(/^@/, '')),
    url: (tgC && tgC.contact_url) || admin.contact_url || ('https://t.me/' + String(acVal).replace(/^@/, '')),
    phone: phC ? String(phC.contact_value || '').replace(/[^0-9+]/g, '') : null,
    note: { uz: "Savol bo'lsa — yozing", ru: 'Есть вопрос — напишите' },
  };

  const plist = asList(promos, 'promotions');
  window.BANNERS = plist.length ? plist.map((p, i) => ({
    id: 'b' + (p.id || i), tag: { uz: 'AKSIYA', ru: 'АКЦИЯ' },
    title: p.title || '', sub: p.subtitle || p.description || '',
    image: p.image || p.image_url || null, icon: 'spark', grad: BANNER_GRADS[i % BANNER_GRADS.length],
  })) : DEFAULT_BANNERS;

  window.__projectsInit = asList(proj, 'photos').map((p) => ({
    id: p.id, src: p.image, caption: p.caption || '', date: p.date || '', uploading: false, progress: 100,
  }));
  window.__projectsMeta = {
    canUpload: proj.can_upload !== false,
    uploadedToday: proj.uploaded_today || 0,
    maxPerDay: proj.max_per_day || 10,
  };
}

Object.assign(window, { TG, TGID, api, uploadXhr, loadData, langToBackend, jinitials });

</script>
<script type="text/babel" data-presets="react">
// app.jsx — JIP GROUP mini-app shell (REAL backend wired)
const { useState: useStateA, useEffect: useEffectA, useRef: useRefA } = React;

const TABS = [
  { id: "home",     uz: "Asosiy",    ru: "Главная",  icon: "home" },
  { id: "rewards",  uz: "Sovg'alar", ru: "Награды",  icon: "gift" },
  { id: "projects", uz: "Loyihalar", ru: "Проекты",  icon: "image" },
  { id: "orders",   uz: "Buyurtma",  ru: "Заказы",   icon: "bag" },
  { id: "profile",  uz: "Profil",    ru: "Профиль",  icon: "user" },
];

function TopBar({ lang, setLang }) {
  return (
    <div style={{ flexShrink: 0, position: "relative", zIndex: 30, display: "flex", alignItems: "center",
      justifyContent: "space-between", padding: "calc(env(safe-area-inset-top, 8px) + 8px) 20px 6px" }}>
      <img src={(window.__resources && window.__resources.jipLogoNavy) || ""}
        alt="JIP GROUP" style={{ height: 17, width: "auto" }} onError={(e) => { e.target.style.display = "none"; }} />
      <div style={{ display: "flex", background: "var(--surface)", borderRadius: 11, padding: 3, gap: 2 }}>
        {["uz", "ru"].map((l) => (
          <button key={l} onClick={() => setLang(l)} className="btn-press"
            style={{ border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 12.5, fontWeight: 650,
              padding: "5px 11px", borderRadius: 8, letterSpacing: "0.02em",
              background: lang === l ? "var(--surface-2)" : "transparent",
              color: lang === l ? "var(--ink)" : "var(--ink-3)",
              boxShadow: lang === l ? "0 1px 2px rgba(20,22,35,.12)" : "none", transition: "all .2s ease" }}>
            {l.toUpperCase()}
          </button>
        ))}
      </div>
    </div>
  );
}

function BottomNav({ active, onNav, lang, ordersBadge }) {
  return (
    <div style={{ flexShrink: 0, position: "relative", zIndex: 20, background: "var(--nav-bg)",
      backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)",
      borderTop: "1px solid var(--line)", paddingBottom: "calc(env(safe-area-inset-bottom, 0px) + 10px)" }}>
      <div style={{ display: "flex", height: 56 }}>
        {TABS.map((t) => {
          const on = active === t.id;
          return (
            <button key={t.id} onClick={() => onNav(t.id)} className="btn-press"
              style={{ flex: 1, border: "none", background: "none", cursor: "pointer", display: "flex",
                flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3,
                fontFamily: "inherit", color: on ? "var(--accent)" : "var(--ink-3)", transition: "color .2s ease", position: "relative" }}>
              <div style={{ position: "relative" }}>
                <Icon name={t.icon} size={23} stroke={on ? 2.1 : 1.7} fill={false} />
                {t.id === "orders" && ordersBadge > 0 && (
                  <span style={{ position: "absolute", top: -4, right: -7, minWidth: 16, height: 16, padding: "0 4px",
                    borderRadius: 8, background: "var(--accent)", color: "#fff", fontSize: 10, fontWeight: 700,
                    display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 0 0 2px var(--nav-bg)" }}>
                    {ordersBadge}
                  </span>
                )}
              </div>
              <span style={{ fontSize: 10.5, fontWeight: on ? 650 : 500, letterSpacing: "-0.01em" }}>{t[lang]}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function useReady() {
  const [ready, setReady] = useStateA(false);
  useEffectA(() => { const id = setTimeout(() => setReady(true), 30); return () => clearTimeout(id); }, []);
  return ready;
}
function ScreenWrap({ children }) {
  const ready = useReady();
  return <div className={"reveal-ctx" + (ready ? " is-ready" : "")}>{children}</div>;
}

// app-level toast (errors / info)
function AppToast({ toast }) {
  if (!toast) return null;
  return (
    <div style={{ position: "absolute", left: 16, right: 16, bottom: "calc(env(safe-area-inset-bottom,0px) + 78px)", zIndex: 80,
      display: "flex", alignItems: "center", gap: 9, padding: "12px 15px", borderRadius: 14,
      background: toast.kind === "error" ? "#C0392B" : "var(--ink)", color: "#fff",
      boxShadow: "0 12px 30px -12px rgba(20,22,35,.5)", animation: "fadeUp .3s ease both" }}>
      <Icon name={toast.kind === "error" ? "x" : "check"} size={17} stroke={2.4} color="#fff" />
      <span style={{ fontSize: 13.5, fontWeight: 550, lineHeight: 1.35 }}>{toast.msg}</span>
    </div>
  );
}

function todayLabel() { return { uz: "Bugun", ru: "Сегодня" }; }

function App() {
  const [lang, setLangRaw] = useStateA(() => localStorage.getItem("jip_lang") || window.__initLang || "uz");
  const [tab, setTab] = useStateA("home");
  const [points, setPoints] = useStateA(USER.points);
  const [scans, setScans] = useStateA(USER.scans);
  const [gifts, setGifts] = useStateA(USER.giftsCount);
  const [orders, setOrders] = useStateA(ORDERS);
  const [projects, setProjects] = useStateA(window.__projectsInit || []);
  const [projMeta, setProjMeta] = useStateA(window.__projectsMeta || { canUpload: true, uploadedToday: 0, maxPerDay: 10 });
  const [success, setSuccess] = useStateA(null);
  const [toast, setToast] = useStateA(null);
  const scrollRef = useRefA(null);
  const toastTimer = useRefA(null);

  const flash = (msg, kind) => {
    setToast({ msg, kind });
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2800);
  };
  const haptic = (type) => { try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred(type); } catch (e) {} };

  const nav = (id) => { setTab(id); if (scrollRef.current) scrollRef.current.scrollTop = 0; };

  const setLang = async (l) => {
    setLangRaw(l); localStorage.setItem("jip_lang", l);
    try { await api("/webapp/update-language/", { method: "POST", body: { language: langToBackend(l) } }); } catch (e) {}
    try { await loadData(); setPoints(USER.points); setScans(USER.scans); setGifts(USER.giftsCount); setOrders(ORDERS); } catch (e) {}
  };

  // ── promo activation (real) ──
  const onPromo = async (code) => {
    try {
      const res = await api("/webapp/register-qr/", { method: "POST", body: { qr_code: code } });
      const amount = res.points || res.points_earned || 0;
      const newBalance = res.total_points != null ? res.total_points : points + amount;
      setPoints(newBalance); setScans((s) => s + 1);
      haptic("success");
      setSuccess({ mode: "earn", amount, newBalance });
      loadData().then(() => { setOrders(ORDERS); }).catch(() => {});
    } catch (e) { haptic("error"); flash(e.message || "Xato", "error"); }
  };

  // ── redeem reward (real) ──
  const onRedeem = async (reward) => {
    if (points < reward.cost || reward.stock <= 0) return;
    try {
      await api("/webapp/request-gift/", { method: "POST", body: { gift_id: reward.id } });
      const newBalance = points - reward.cost;
      setPoints(newBalance); setGifts((g) => g + 1);
      setOrders((prev) => [{ id: Date.now(), title: reward.title, icon: "gift", image: reward.image,
        cost: reward.cost, date: todayLabel(), status: "pending", cancelable: true }, ...prev]);
      haptic("success");
      setSuccess({ mode: "redeem", reward, newBalance });
      loadData().then(() => { setOrders(ORDERS); }).catch(() => {});
    } catch (e) { haptic("error"); flash(e.message || "Xato", "error"); }
  };

  const cancelOrder = async (id) => {
    const prev = orders;
    // faol ro'yxatdan darrov olib tashlaymiz (keyin tarixда qayta paydo bo'ladi)
    setOrders((p) => p.filter((o) => o.id !== id));
    try {
      const res = await api("/webapp/cancel-order/", { method: "POST", body: { redemption_id: id } });
      // ball qaytdi — darrov ko'rsatamiz
      if (res && res.new_points != null) setPoints(res.new_points);
      // backenddan qayta yuklaymiz: bekor qilinган buyurtma "Tarix"да ko'rinadi + ball aniq
      await loadData(); setOrders(ORDERS); setPoints(USER.points);
    } catch (e) { setOrders(prev); flash(e.message || "Xato", "error"); }
  };
  const confirmDelivery = async (id) => {
    setOrders((prev) => prev.map((o) => o.id === id ? { ...o, status: "delivered", cancelable: false } : o));
    try { await api("/webapp/confirm-delivery/", { method: "POST", body: { redemption_id: id, confirmed: true } }); }
    catch (e) { flash(e.message || "Xato", "error"); }
  };

  // ── projects (real upload / delete / caption) ──
  const addProject = async (file, caption) => {
    const tmpId = "tmp" + Date.now();
    const src = URL.createObjectURL(file);
    setProjects((prev) => [{ id: tmpId, src, caption: caption || "", date: todayLabel(), uploading: true, progress: 8 }, ...prev]);
    try {
      const fd = new FormData();
      fd.append("photo", file);
      if (caption) fd.append("caption", caption);
      if (TGID) { fd.append("telegram_id", TGID); fd.append("tg_id", TGID); }
      const q = TGID ? "?tg_id=" + TGID + "&telegram_id=" + TGID : "";
      const data = await uploadXhr("/api/webapp/projects/upload/" + q, fd,
        (pct) => setProjects((prev) => prev.map((x) => x.id === tmpId ? { ...x, progress: pct } : x)));
      setProjects((prev) => prev.map((x) => x.id === tmpId
        ? { id: data.id, src: data.image, caption: data.caption || "", date: data.date || "", uploading: false, progress: 100 }
        : x));
      setProjMeta((m) => { const ut = (m.uploadedToday || 0) + 1; return { ...m, uploadedToday: ut, canUpload: ut < (m.maxPerDay || 10) }; });
      haptic("success");
    } catch (e) {
      setProjects((prev) => prev.filter((x) => x.id !== tmpId));
      haptic("error"); flash(e.message || "Yuklab bo'lmadi", "error");
    }
  };
  const removeProject = async (id) => {
    const prev = projects;
    setProjects((p) => p.filter((x) => x.id !== id));
    try { await api("/webapp/projects/delete/", { method: "POST", body: { id } }); }
    catch (e) { setProjects(prev); flash(e.message || "Xato", "error"); }
  };
  const updateCaption = async (id, text) => {
    setProjects((prev) => prev.map((x) => x.id === id ? { ...x, caption: text } : x));
    try { await api("/webapp/projects/caption/", { method: "POST", body: { id, caption: text } }); } catch (e) {}
  };

  const ordersBadge = orders.filter((o) => o.status !== "delivered").length;
  const projFull = projMeta.canUpload === false;
  const screens = {
    home:     <HomeScreen points={points} scans={scans} gifts={gifts} onPromo={onPromo} onNav={nav} empty={false} />,
    rewards:  <RewardsScreen points={points} onRedeem={onRedeem} empty={false} layout="grid" />,
    projects: <ProjectsScreen projects={projects} onAdd={addProject} onRemove={removeProject} onCaption={updateCaption}
                full={projFull} uploadedToday={projMeta.uploadedToday} maxPerDay={projMeta.maxPerDay} empty={false} />,
    orders:   <OrdersScreen orders={orders} empty={false} onCancel={cancelOrder} onConfirm={confirmDelivery} onNav={nav} />,
    profile:  <ProfileScreen points={points} scans={scans} gifts={gifts} lang={lang} setLang={setLang} onNav={nav} />,
    activity: <ActivityScreen empty={false} onBack={() => nav("profile")} />,
  };

  return (
    <LangCtx.Provider value={lang}>
      <div className="device-root" style={{ "--radius": "22px", "--accent": "#0B63F6", "--on-accent": "#fff" }}>
        <TopBar lang={lang} setLang={setLang} />
        <div ref={scrollRef} className="scroll-area no-scrollbar"
          style={{ flex: 1, overflowY: "auto", overflowX: "hidden", position: "relative" }}>
          <ScreenWrap key={tab + lang}>{screens[tab]}</ScreenWrap>
        </div>
        {tab !== "activity" && <BottomNav active={tab} onNav={nav} lang={lang} ordersBadge={ordersBadge} />}
        {success && (
          <SuccessOverlay data={success} points={points}
            onClose={() => setSuccess(null)}
            onGoOrders={() => { setSuccess(null); nav("orders"); }} />
        )}
        <AppToast toast={toast} />
      </div>
    </LangCtx.Provider>
  );
}

function DeviceStage() {
  return (<div className="stage"><div className="app-shell"><App /></div></div>);
}

(async function boot() {
  if (TG) {
    try { TG.ready(); } catch (e) {}
    try { TG.expand(); } catch (e) {}
    try { TG.setHeaderColor("#ffffff"); } catch (e) {}
    try { TG.setBackgroundColor("#ffffff"); } catch (e) {}
    try { if (TG.disableVerticalSwipes) TG.disableVerticalSwipes(); } catch (e) {}
  }
  try { await loadData(); } catch (e) {
    window.USER = window.USER || { tgId: TGID || 0, name: "Usta", fullName: "Usta", initials: "U", username: "", phone: "", points: 0, scans: 0, giftsCount: 0, rank: 0 };
    window.STATUS = window.STATUS || { pending: { label: { uz: "Qabul qilindi", ru: "Принят" }, step: 1 }, approved: { label: { uz: "Tasdiqlandi", ru: "Подтверждён" }, step: 2 }, shipping: { label: { uz: "Berishga tayyor", ru: "Готов к выдаче" }, step: 3 }, delivered: { label: { uz: "Olindi", ru: "Получен" }, step: 4 } };
    window.REWARDS = window.REWARDS || []; window.ORDERS = window.ORDERS || []; window.TOP_USERS = window.TOP_USERS || [];
    window.ACTIVITY = window.ACTIVITY || []; window.BANNERS = window.BANNERS || []; window.ADMIN = window.ADMIN || { handle: "@jip_support", url: "https://t.me/jip_support", note: { uz: "", ru: "" } };
    window.__projectsInit = window.__projectsInit || []; window.__projectsMeta = window.__projectsMeta || { canUpload: true, uploadedToday: 0, maxPerDay: 10 };
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<DeviceStage />);
})();

</script>
